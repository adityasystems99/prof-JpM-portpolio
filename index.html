ader learns how Sv39 hardware walks a page table before reading the kernel routine that builds one.","Every line of xv6 assembly, every CSR write and every interrupt handler is cross-referenced to the chapter that explains the hardware; each xv6 chapter opens with a box of the RISC-V features it depends on.","Build it yourself first: readers write a bare-metal timer interrupt handler and map a page by hand on QEMU before seeing how xv6 does it.","Treats trap routing exhaustively (delegation, enable and pending gates, edge cases), with a running mstatus diagram filled in across chapters; the traps chapter is the longest in the book.","Ends with porting xv6 from QEMU to real RISC-V boards, plus five reference appendices and a sequence of suggested labs."],"description":"Back-cover text: a bottom-up guide that takes a reader from the very first RISC-V instruction to a working operating system they can read and modify. It teaches the RV64GC instruction set and the standard extensions, then the privileged architecture in depth (traps and interrupt routing, the CLINT and PLIC, supervisor mode, Sv39 virtual memory, physical memory protection, boot, and the SBI) before walking through the xv6 kernel chapter by chapter.","toc":[{"part":"Part I: The Base Machine","chapters":[{"n":1,"title":"Why RISC-V?","summary":"A short history of instruction sets, what makes RISC-V different, its ecosystem, and how to read the specification."},{"n":2,"title":"Bits, Bytes, and Binary","summary":"Number systems, two's complement, bitwise operations and memory layout."},{"n":3,"title":"The Core RV64I Instructions","summary":"The register file, instruction formats, arithmetic and logic, LUI and AUIPC, and encoding by hand."},{"n":4,"title":"Control Flow","summary":"Branches, jumps, the call stack, the calling convention, recursion, and compiling C to RISC-V."},{"n":5,"title":"Loads, Stores & the Memory Model","summary":"Load and store instructions, addressing patterns, alignment, FENCE and memory ordering, and endianness."},{"n":6,"title":"The Toolchain in Practice","summary":"Toolchain install, assembling and linking, linker scripts, QEMU, GDB, and a first bare-metal program."}]},{"part":"Part II: User-Mode Extensions","chapters":[{"n":7,"title":"The M Extension (Multiply and Divide)","summary":"Why multiply is an extension, multiplication, division and remainder, and performance."},{"n":8,"title":"The A Extension (Atomics)","summary":"LR/SC, atomic memory operations, aq/rl ordering, and building the spinlock later met in the kernel."},{"n":9,"title":"The F and D Extensions (Floating Point)","summary":"IEEE 754, the FP register file, single and double precision, FCSR, and FP state at context switch."},{"n":10,"title":"The C Extension (Compressed Instructions)","summary":"Code density, 16-bit encodings, mapping to the base ISA, and effects on alignment and branching."},{"n":11,"title":"Zicsr, Zifencei & the Extension Landscape","summary":"CSR access instructions, the instruction fence, extension naming, profiles, and runtime discovery."}]},{"part":"Part III: Privileged Architecture","chapters":[{"n":12,"title":"Privilege Levels & Machine Mode","summary":"Why privilege levels exist, M/S/U modes, machine CSRs, delegation, and minimal M-mode firmware."},{"n":13,"title":"Traps: Interrupts & Exceptions","summary":"The full trap lifecycle, mcause, mepc and mtval, and how traps are routed across privilege levels."},{"n":14,"title":"The CLINT & Timer Interrupts","summary":"The memory-mapped CLINT, timer and software interrupts, a complete bare-metal timer example, and delegation to S-mode."},{"n":15,"title":"Supervisor Mode","summary":"The S-mode CSR mirror, S-mode trap flow, ecall, entering S-mode from M-mode, and counter access."},{"n":16,"title":"Virtual Memory","summary":"Sv39 three-level page tables, the translation walk, PTE flags, permission faults, satp, and the TLB with sfence.vma."},{"n":17,"title":"The PLIC: External Interrupts","summary":"PLIC architecture and registers, the claim/complete protocol, writing a PLIC driver, and the PLIC in xv6."},{"n":18,"title":"PMP, Boot & the SBI","summary":"Physical Memory Protection registers, matching modes and lock bit, PMP in OpenSBI, the boot path and the SBI."}]},{"part":"Part IV: xv6 on RISC-V","chapters":[{"n":19,"title":"xv6 Boot & First Instructions","summary":"The xv6 source tree, entry.S, M-mode setup in start.c, kernel initialisation in main.c, and common boot failures."},{"n":20,"title":"Physical Memory Allocator","summary":"The free-list page allocator: kinit, kfree and kalloc, and why its simplicity works."},{"n":21,"title":"Page Tables in xv6","summary":"walk, mappages, building and enabling the kernel page table, and the user address space."},{"n":22,"title":"Traps & System Calls in xv6","summary":"The trampoline, uservec, usertrap, syscall dispatch, device interrupts, and the return to user mode."},{"n":23,"title":"Processes","summary":"struct proc, process states and table, allocproc, fork, exec, and wait."},{"n":24,"title":"Scheduling & Context Switching","summary":"The xv6 scheduler, swtch.S, sleep and wakeup, and why the lock protocol matters."},{"n":25,"title":"The Dance of Privilege in xv6","summary":"A map of every privilege transition: system calls, device and timer interrupts, context switches and kernel traps."},{"n":26,"title":"Locking & Concurrency","summary":"Race conditions, spinlocks with acquire and release, why interrupts are disabled, sleep-locks, and debugging locks."},{"n":27,"title":"File System I: On-Disk Layout","summary":"File system layers, disk layout, the buffer cache, logging, crash recovery and transactions."},{"n":28,"title":"File System II: Names & Descriptors","summary":"Inodes on disk and in memory, directories, pathname lookup, file descriptors and the file system calls."},{"n":29,"title":"Device Drivers","summary":"The UART driver, the top/bottom half model, and the virtio disk driver with its descriptor rings."},{"n":30,"title":"Pipes, Exec & the Shell","summary":"Pipe implementation, exec and ELF basics, the init process, and the xv6 shell with I/O redirection."}]},{"part":"Part V: Tying It Together","chapters":[{"n":31,"title":"Multicore, SMP & Per-CPU State","summary":"Multiple harts, multicore boot, inter-processor interrupts, and per-CPU state."},{"n":32,"title":"Porting xv6 to Real Hardware","summary":"Moving from QEMU to real boards: what changes, device tree parsing, and JTAG debugging."}]},{"part":"Appendices","chapters":[{"n":"A","title":"RV64GC Instruction Quick Reference","summary":"RV64I and the M, A, F, D and C extensions, plus pseudo-instructions."},{"n":"B","title":"CSR Reference Table","summary":"Machine, supervisor and user-level CSRs."},{"n":"C","title":"xv6 System Call Reference","summary":"Process management and file system calls."},{"n":"D","title":"Lab Setup Guide","summary":"Toolchain, QEMU and GDB setup, building xv6, and a guided GDB session."},{"n":"E","title":"Suggested Labs & Projects","summary":"A week-by-week lab sequence from assembly basics to PMP and page-table builders."}]}],"short":"RISC-V Architecture and XV6"}],"tools":{"tools":[{"id":"xv6","name":"xv6, line by line","url":"https://xv6.jyotiprakash.org","live":true,"repo":"https://github.com/ShowMeTheStack/xv6-line-by-line","relatedRepos":["https://github.com/ShowMeTheStack/xv6-riscv-labs"],"tagline":"Every line of a real operating system, explained. Every claim checked against the running kernel.","glance":"An interactive commentary on all 83 files of MIT's xv6-riscv, with tours, 500 questions and 25 labs.","problem":"Students in an operating systems course read kernel code without seeing the machine state behind it. They lose track of which stack is active, which page table is loaded, whether interrupts are on and which locks are held. Stacks, the trap path and locking are the ideas they find hardest.","why":"I taught operating systems at UW-Madison and KIIT and wrote a book on RISC-V and xv6 (De Gruyter Brill, 2026). I wanted a companion where no line is left unexplained and where every statement about the kernel is checked against xv6 running on QEMU, so the text cannot drift from the code.","features":["All 83 source files of xv6-riscv (commit 06aad25), 13,249 lines; every non-blank line (11,666 of 11,666) is annotated","2,457 named symbols cross-referenced across C, RISC-V assembly, linker scripts and the Makefile; 229 glossary terms","52 guided tours with 1,009 steps, from make to the shell prompt, system calls, page faults, context switches, fork, exec and the log","Each tour step shows the hart, process, privilege mode, active stack and page table, interrupt state (982 strips) and held locks, recorded from xv6 under gdb","Three long-form concept pages: stacks; mode, stack and page table; locks","500 auto-graded questions in 20 categories and nine question types, each answer linked back into the annotated source","25 extension labs (trace, copy-on-write fork, mmap, superpages, ticket spinlocks, lockdep-lite, symbolic links, an e1000 driver with UDP sockets, and more), each with a reference solution as its own git branch","A seven-phase lab format with 305 self-checks, a debugging clinic of 142 real bugs, and 435 guided reveal steps; the labs add about 13,600 lines in 190 commits","Every reference solution passes its own test and xv6's full usertests on three harts","A validator re-checks every code reference against the pinned sources on each build"],"tech":["Python static site generator","libclang for C, hand-written scanners for assembly, linker scripts and the Makefile","Vanilla JavaScript front end","GitHub Pages"],"license":"Content CC BY-NC-SA 4.0; software GPL-3.0-or-later with an attribution term; xv6 itself MIT","shots":[{"src":"assets/tools/xv6-1.jpg","caption":""},{"src":"assets/tools/xv6-2.jpg","caption":""},{"src":"assets/tools/xv6-3.jpg","caption":""}]},{"id":"8086","name":"µSystem 8086","url":"https://8086.jyotiprakash.org","live":true,"repo":"https://github.com/ShowMeTheStack/usystem-8086","tagline":"A cycle-accurate 8086/8088 computer you build chip by chip, wire by wire, in a single HTML file. Boots FreeDOS.","glance":"A browser trainer kit: wire period 8086 chips on a canvas, assemble code, and step it cycle by cycle.","problem":"Microprocessor courses teach bus cycles, address decoding, interrupts and DMA, but students rarely get to wire a real system and watch the signals. Hardware trainer kits are fixed boards with fixed chips, and a wiring mistake is hard to see.","why":"I wanted a tool that replaces the trainer kit: students get the parts instead of a finished board, and every wire carries a real logic level. Nothing about the board is declared; the address map is found by driving the student's own decode gates, so a wrong wiring shows up the way it would on an oscilloscope.","features":["CPU core is 100.00% exact on the full SingleStepTests/8088 suite: 3,007,000 cases, every documented and undocumented instruction and every undefined flag bit","Period chips placed and wired pin by pin: 8086/8088, 8284A, 8237A DMA, 8259A, 8253, 8255, SRAM/EPROM, 74LS glue logic, Hercules video, µPD765 floppy controller, XT keyboard","The PC/XT preset runs GLaBIOS from EPROM, loads the boot sector over DMA channel 2 and boots FreeDOS 1.3","Twenty-one preset boards, from a ripple counter to the PC/XT; nine ship a guided lab","Design rule checks for shorts, bus contention, floating inputs and partial decode","Step by clock half-cycle or by instruction, rewind the whole machine, probe any wire, and read a waveform analyzer","A built-in 8086 assembler; turbo mode reaches real 8088 speed","An illustrated guide of 13 sections with 570 screenshots captured from the running tool; twenty colour themes","One static HTML file, no server and no install"],"tech":["Vanilla JavaScript, no dependencies","Single-file build (node build.mjs)","Headless Chromium tests","GitHub Pages"],"license":"GPL-3.0-or-later (embeds GLaBIOS GPL-3, FreeDOS 1.3 boot disk GPL-2+)","shots":[{"src":"assets/tools/8086-1.jpg","caption":""},{"src":"assets/tools/8086-2.jpg","caption":""},{"src":"assets/tools/8086-3.jpg","caption":""}]},{"id":"netsim","name":"NetSim","url":"https://netsim.jyotiprakash.org","live":true,"repo":"https://github.com/ShowMeTheStack/netsim","tagline":"A browser-based, client-side IPv4 network simulator for learning. Build topologies, watch real protocols run packet by packet, inspect every frame.","glance":"Build IPv4 networks in the browser, step real protocols one packet at a time, and decode every byte.","problem":"The hard parts of networking are the parts a textbook cannot show: timing, the state each device keeps, and what happens when things go wrong. A diagram of the TCP handshake does not show slow start backing off after a loss, and a static capture does not let a student pause, change one setting, and run it again.","why":"I teach computer networks and wanted Packet Tracer style topology building and Wireshark style inspection in one tool, with a clock the student controls and protocol implementations that are readable code rather than black boxes.","features":["Deterministic discrete-event engine in integer microseconds, run in a Web Worker; play, run until quiet, step one event or one packet","Byte-accurate packet codecs; a sniffer on any link, layered decode with hex highlighting, and a physical-layer view (NRZ, NRZI, Manchester)","Conditional breakpoints that stop the moment a matching packet appears","Routing with static routes, RIP, OSPF and BGP (eBGP, iBGP, route reflectors); NAT with port forwarding","TCP with Tahoe, Reno, NewReno, CUBIC and SACK, with congestion window and sequence charts","DHCP, a real DNS hierarchy with a recursive resolver, and HTTP with a request waterfall","Switches with MAC learning and 802.1Q VLANs; switch logic can be replaced by sandboxed user JavaScript","802.11-style wireless with carrier sense, backoff, RTS/CTS and the hidden-node problem","Real C socket programs compiled in the browser (clang) and run on the simulated network, including fork, pthreads, select, poll and epoll","81 guided labs in 19 modules, each checked by a test that it can be completed; 40 colour themes"],"tech":["TypeScript","React","Vite","Zustand","Web Worker","clang in the browser for C programs","Playwright end-to-end tests"],"license":"GPL-3.0-or-later","shots":[{"src":"assets/tools/netsim-1.jpg","caption":""},{"src":"assets/tools/netsim-2.jpg","caption":""},{"src":"assets/tools/netsim-3.jpg","caption":""}]},{"id":"compy","name":"Compy","url":"https://compy.jyotiprakash.org","live":true,"repo":"https://github.com/ShowMeTheStack/compy","tagline":"A compiler you can watch: C89 through tokens, AST, types, IR, optimization passes and RISC-V, plus a language lab for automata and parsing.","glance":"A C89 to RISC-V compiler in the browser that shows every phase, plus a lab for automata and parsers.","problem":"In a compilers course the hard part is not any single algorithm. It is holding the whole pipeline in one's head and believing that each stage does what the lecture says. A listing of LR items in a textbook is inert.","why":"I wrote the whole toolchain, from the preprocessor to the register allocator to the machine simulator, for this tool, so that every intermediate result is available to draw. Students can then see the state the parser is in, with the stack and the remaining input beside it, and argue with it.","features":["A live phase bar: Source, Tokens, Preprocess, Parse, Types, IR, Optimize, Codegen, Run","A complete C89 preprocessor and hand-written recursive-descent parser; struct layouts drawn with padding (ILP32)","A typed three-address IR in the style of LLVM, shown as text or as a control-flow graph","Eight switchable optimization passes (simplify-CFG, mem2reg/SSA, inlining, constant folding, strength reduction, CSE, DCE, LICM) with before/after diffs","RISC-V RV32IM+F/D back end with naive and linear-scan register allocators, a live-interval chart and a machine stepper","Three execution engines (AST interpreter, IR interpreter, RISC-V simulator) over one checked process-memory model that catches null dereference, out-of-bounds, use-after-free, double free and leaks","A reversible debugger that steps forwards and backwards on all three engines","A language lab: regex to NFA to DFA to minimal DFA, FIRST/FOLLOW, grammar transformations, nine parsers (LL(1), LR(0), SLR, LR(1), LALR(1), Earley, CYK, operator precedence, recursive descent) and a PDA","32 compiler lessons and 19 language-lab lessons","Differential testing against clang -std=c89, and a 3,669-case end-to-end browser suite"],"tech":["TypeScript","React","Vite","CodeMirror","npm workspace of nine packages","Vitest and Playwright"],"license":"GPL-3.0-or-later with an attribution term","shots":[{"src":"assets/tools/compy-1.jpg","caption":""},{"src":"assets/tools/compy-2.jpg","caption":""},{"src":"assets/tools/compy-3.jpg","caption":""}]},{"id":"baysik","name":"Baysik","url":"https://baysik.jyotiprakash.org","live":true,"repo":"https://github.com/ShowMeTheStack/baysik","tagline":"A GW-BASIC and QBasic programming environment in a single HTML file.","glance":"GW-BASIC and QBasic in one browser page, with real PC screen modes, sound and a full debugger.","problem":"Beginners need a first language with an immediate, visible result, but running classic BASIC today means installing DOSBox and finding an old interpreter. Old interpreters also give a learner little help in seeing what a program is doing.","why":"I learned to program on Logo and then BASIC, and wanted something I could hand to a child, a student, or an old hand without asking anyone to install anything. I also wanted a debugger that shows every frame of a recursion and lets the learner change any value.","features":["One combined language: all of QBasic 1.1 plus GW-BASIC line-numbered features and some QuickBASIC extras","Every QBasic screen mode at its <script>
// ==== order.js ====
// The one order papers are shown in, everywhere: the page, the CV, the terminal and the README.
// The thesis journal papers come first, by the impact rank set in the data; then the rest, published
// before accepted before preprints before those under review, newest first.
(function (root) {
  'use strict';
  const STATUS = { published: 0, accepted: 1, preprint: 2, 'under review': 3 };
  const KIND = { journal: 0, conference: 1, review: 2, preprint: 3 };
  const rankOf = (map, k) => (k in map ? map[k] : 9);
  function papers(list) {
    return list.slice().sort((a, b) =>
      (b.thesis ? 1 : 0) - (a.thesis ? 1 : 0) ||
      rankOf(STATUS, a.status) - rankOf(STATUS, b.status) ||
      (a.impact || 999) - (b.impact || 999) ||
      (b.year || 0) - (a.year || 0) ||
      rankOf(KIND, a.kind) - rankOf(KIND, b.kind) ||
      String(a.title).localeCompare(String(b.title)));
  }
  const thesis = (list) => papers(list.filter((p) => p.thesis));
  /** how a paper is labelled in a short list: its venue and indexing, and that it is a thesis paper */
  const label = (p) => [p.venueShort, p.indexing].filter(Boolean).join(' · ');
  /** the landing page names only the journal indexing of the thesis papers, and no indexing for the rest */
  const short = (p) => (p.thesis ? label(p) : p.venueShort || '');
  root.Order = { papers, thesis, label, short };
})(typeof window !== 'undefined' ? window : globalThis);

// ==== rain.js ====
// The falling characters behind everything. Now and then a column spells a word from the work.
(function () {
  'use strict';
  const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEF<>=+*#$%';
  const WORDS = ['RISC-V', 'SPECTRE', 'XV6', 'CACHE', 'TLB', 'BOOM', 'ROCKET', 'AES', 'DPA', 'SV39', 'FENCE.I', 'ECALL', 'MRET', 'LLC', 'PRIME+PROBE', 'FLUSH+RELOAD', 'C89', 'GW-BASIC', 'LOGO', '8086', 'TCP', 'MALLOC', 'FREE', 'NULL'];
  const R = {
    canvas: null, ctx: null, cols: [], size: 16, last: 0, running: false, colour: '#39ff7a', head: '#ffffff', speed: 1,
    start() {
      this.canvas = document.getElementById('rain');
      if (!this.canvas) return;
      this.ctx = this.canvas.getContext('2d');
      this.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.addEventListener('resize', () => this.resize());
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.loop(); });
      this.resize();
      this.running = true;
      this.loop();
    },
    theme() {
      const cs = getComputedStyle(document.documentElement);
      this.colour = cs.getPropertyValue('--rain').trim() || '#39ff7a';
      this.head = cs.getPropertyValue('--rain-head').trim() || '#ffffff';
      this.bg = cs.getPropertyValue('--bg').trim() || '#000';
      this.ctx.fillStyle = this.bg;
      this.ctx.fillRect(0, 0, this.w, this.h);
      if (this.reduced) this.still();
    },
    resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.w = window.innerWidth; this.h = window.innerHeight;
      this.canvas.width = this.w * dpr; this.canvas.height = this.h * dpr;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.size = this.w < 600 ? 13 : 16;
      const n = Math.ceil(this.w / this.size);
      this.cols = Array.from({ length: n }, () => this.column(true));
      this.theme();
    },
    column(scatter) {
      const word = Math.random() < 0.08 ? WORDS[(Math.random() * WORDS.length) | 0] : null;
      return { y: scatter ? Math.random() * -60 : -Math.random() * 30, v: 0.35 + Math.random() * 0.75, word, k: 0, cell: -1, prev: '' };
    },
    glyph(c) {
      if (c.word) { const ch = c.word[c.k % c.word.length]; c.k++; return ch; }
      return GLYPHS[(Math.random() * GLYPHS.length) | 0];
    },
    still() {
      const ctx = this.ctx, s = this.size;
      ctx.font = s + 'px monospace';
      for (let i = 0; i < this.cols.length; i++) for (let y = 0; y < this.h / s; y++) if (Math.random() < 0.08) { ctx.fillStyle = this.colour; ctx.globalAlpha = Math.random() * 0.5; ctx.fillText(this.glyph({}), i * s, y * s); }
      ctx.globalAlpha = 1;
    },
    loop() {
      if (this.reduced || !this.running || document.hidden) return;
      requestAnimationFrame((t) => {
        if (t - this.last > 45) { this.last = t; this.step(); }
        this.loop();
      });
    },
    step() {
      const ctx = this.ctx, s = this.size;
      // fade what is there, so each column leaves a tail
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = this.bg;
      ctx.fillRect(0, 0, this.w, this.h);
      ctx.globalAlpha = 1;
      ctx.font = s + 'px monospace';
      ctx.textBaseline = 'top';
      for (let i = 0; i < this.cols.length; i++) {
        const c = this.cols[i];
        c.y += c.v * this.speed;
        const cell = Math.floor(c.y);
        if (cell !== c.cell) {
          // the old head dims to the column colour, and a new bright head appears below it
          if (c.cell >= 0 && c.prev) { ctx.fillStyle = this.bg; ctx.fillRect(i * s, c.cell * s, s, s); ctx.fillStyle = this.colour; ctx.fillText(c.prev, i * s, c.cell * s); }
          c.cell = cell;
          if (cell >= 0) { c.prev = this.glyph(c); ctx.fillStyle = this.head; ctx.fillText(c.prev, i * s, cell * s); }
        } else if (cell >= 0 && c.prev) { ctx.fillStyle = this.head; ctx.fillText(c.prev, i * s, cell * s); }
        if (cell * s > this.h && Math.random() > 0.975) this.cols[i] = this.column(false);
      }
    },
  };
  window.Rain = R;
})();

// ==== photo.js ====
// The photo, drawn differently in every theme: green glyphs for Matrix, an amber CRT, a neon duotone that
// glitches, a blue halftone, a thermal camera with a scanning crosshair, ASCII art, and plain paper.
(function () {
  'use strict';
  const GL = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ01';
  const ASCII = ' .:-=+*#%@';
  const P = {
    img: null, canvas: null, ctx: null, luma: null, rgb: null, N: 0, theme: 'matrix', t: 0, timer: null,
    mount(box, src, onReady) {
      this.canvas = document.createElement('canvas');
      box.appendChild(this.canvas);
      this.ctx = this.canvas.getContext('2d');
      this.img = new Image();
      this.img.onload = () => { this.sample(); this.resize(); if (onReady) onReady(); };
      this.img.src = src;
      this.reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(box);
      document.addEventListener('visibilitychange', () => this.tick());
    },
    /** brightness and colour of the photo on a coarse grid, read once */
    sample() {
      const S = 160;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const x = c.getContext('2d');
      x.drawImage(this.img, 0, 0, S, S);
      const d = x.getImageData(0, 0, S, S).data;
      this.N = S;
      this.luma = new Float32Array(S * S);
      this.rgb = d;
      for (let i = 0; i < S * S; i++) this.luma[i] = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
      // a gentle contrast stretch so the face reads well in every style
      let lo = 1, hi = 0;
      for (const v of this.luma) { if (v < lo) lo = v; if (v > hi) hi = v; }
      for (let i = 0; i < this.luma.length; i++) this.luma[i] = Math.min(1, Math.max(0, (this.luma[i] - lo) / (hi - lo || 1)));
    },
    resize() {
      if (!this.canvas || !this.img.complete) return;
      const r = this.canvas.parentNode.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.W = Math.max(60, Math.round(r.width));
      this.canvas.width = this.W * dpr; this.canvas.height = this.W * dpr;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.draw();
    },
    set(theme) { this.theme = theme; this.draw(); this.tick(); },
    css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
    L(u, v) { const N = this.N; const x = Math.min(N - 1, Math.max(0, (u * N) | 0)), y = Math.min(N - 1, Math.max(0, (v * N) | 0)); return this.luma[y * N + x]; },
    tick() {

      const live = { matrix: 140, neon: 120, redteam: 60, amber: 160 }[this.theme];
      if (!live) return;
      this.timer = setTimeout(() => { this.t++; this.draw(); this.tick(); }, live);
    },
    label() { return { matrix: 'decoded', amber: 'crt 1983', neon: 'signal: unstable', ice: 'halftone', redteam: 'thermal / target', ghost: 'ascii', paper: 'photo' }[this.theme] || ''; },
    draw() {
      if (!this.luma || !this.W) return;
      const ctx = this.ctx, W = this.W;
      ctx.save();
      ctx.clearRect(0, 0, W, W);
      const f = this['draw_' + this.theme] || this.draw_paper;

      ctx.restore();
      if (this.onLabel) this.onLabel(this.label());
    },
    // ---- the styles ------------------------------------------------------------------------------------------
    draw_paper(ctx, W) {
      ctx.filter = 'sepia(0.18) contrast(1.04)';
      ctx.drawImage(this.img, 0, 0, W, W);
      ctx.filter = 'none';
    },
    draw_matrix(ctx, W) {
      // the face, faint and green, under a grid of glyphs whose brightness follows it
      ctx.filter = 'grayscale(1) contrast(1.3) brightness(0.55)';
      ctx.drawImage(this.img, 0, 0, W, W);
      ctx.filter = 'none';
      ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#39ff7a'; ctx.fillRect(0, 0, W, W);
      ctx.globalCompositeOperation = 'source-over';
      const cell = Math.max(7, Math.round(W / 40));
      ctx.font = 'bold ' + cell + 'px monospace';
      ctx.textBaseline = 'top';
      const n = Math.ceil(W / cell);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const l = Math.pow(this.L((x + 0.5) / n, (y + 0.5) / n), 0.75);
        if (l < 0.08) continue;
        // a few glyphs change every frame, like the code is still running
        const k = (x * 7 + y * 13 + (((x * 31 + y * 17 + this.t) % 9 === 0) ? this.t : 0)) % GL.length;
        const g = Math.round(90 + l * 165);
        ctx.fillStyle = l > 0.86 ? '#eaffef' : 'rgb(' + Math.round(l * 60) + ',' + g + ',' + Math.round(40 + l * 60) + ')';
        ctx.globalAlpha = 0.45 + l * 0.55;
        ctx.fillText(GL[k], x * cell, y * cell);
      }
      ctx.globalAlpha = 1;
    },
    draw_amber(ctx, W) {
      ctx.filter = 'grayscale(1) contrast(1.25) brightness(1.05)';
      ctx.drawImage(this.img, 0, 0, W, W);
      ctx.filter = 'none';
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#ffb000'; ctx.fillRect(0, 0, W, W);
      ctx.globalCompositeOperation = 'source-over';
      // scan lines, a soft glow and the curved dark edge of an old tube
      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      for (let y = 0; y < W; y += 3) ctx.fillRect(0, y, W, 1);
      const flick = this.reduced ? 0 : (Math.sin(this.t * 1.7) + 1) * 0.02;
      ctx.fillStyle = 'rgba(255,190,60,' + (0.04 + flick) + ')'; ctx.fillRect(0, 0, W, W);
      const g = ctx.createRadialGradient(W / 2, W / 2, W * 0.35, W / 2, W / 2, W * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.8)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
      const bar = ((this.t * 4) % (W + 60)) - 30;
      ctx.fillStyle = 'rgba(255,220,140,0.06)'; ctx.fillRect(0, bar, W, 22);
    },
    draw_neon(ctx, W) {
      // duotone: shadows in deep violet, highlights in cyan, the middle in magenta
      const N = this.N, im = ctx.createImageData(N, N);
      for (let i = 0; i < N * N; i++) {
        const l = this.luma[i];
        const a = [20, 4, 40], b = [255, 43, 214], c = [0, 240, 255];
        const t = l < 0.5 ? l * 2 : (l - 0.5) * 2, p = l < 0.5 ? a : b, q = l < 0.5 ? b : c;
        im.data[i * 4] = p[0] + (q[0] - p[0]) * t; im.data[i * 4 + 1] = p[1] + (q[1] - p[1]) * t; im.data[i * 4 + 2] = p[2] + (q[2] - p[2]) * t; im.data[i * 4 + 3] = 255;
      }
      const off = document.createElement('canvas'); off.width = N; off.height = N; off.getContext('2d').putImageData(im, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, 0, 0, W, W);
      // every few frames, a glitch: slices of the picture jump sideways and the colours split
      const glitch = !this.reduced && this.t % 23 < 3;
      if (glitch) {
        for (let k = 0; k < 6; k++) {
          const y = Math.random() * W, h = 4 + Math.random() * 18, dx = (Math.random() - 0.5) * 30;
          ctx.drawImage(this.canvas, 0, y * (this.canvas.width / W), this.canvas.width, h * (this.canvas.width / W), dx, y, W, h);
        }
        ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.5;
        ctx.drawImage(off, 4, 0, W, W);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      }
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      for (let y = 0; y < W; y += 2) ctx.fillRect(0, y, W, 1);
    },
    draw_ice(ctx, W) {
      ctx.fillStyle = '#020a18'; ctx.fillRect(0, 0, W, W);
      const cell = Math.max(5, Math.round(W / 58));
      const n = Math.ceil(W / cell);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const l = this.L((x + 0.5) / n, (y + 0.5) / n);
        const r = (cell / 2) * Math.sqrt(l) * 1.05;
        if (r < 0.4) continue;
        ctx.fillStyle = l > 0.8 ? '#e6f7ff' : '#4cc3ff';
        ctx.beginPath(); ctx.arc(x * cell + cell / 2 + (y % 2 ? cell / 2 : 0), y * cell + cell / 2, r, 0, Math.PI * 2); ctx.fill();
      }
    },
    draw_redteam(ctx, W) {
      // a thermal camera: dark is cold blue-black, warm is red, hot is yellow-white
      const N = this.N, im = ctx.createImageData(N, N);
      const stops = [[0, [6, 0, 18]], [0.25, [70, 0, 110]], [0.5, [200, 20, 40]], [0.72, [255, 110, 0]], [0.9, [255, 220, 40]], [1, [255, 255, 230]]];
      for (let i = 0; i < N * N; i++) {
        const l = this.luma[i];
        let k = 0; while (k < stops.length - 2 && l > stops[k + 1][0]) k++;
        const [a, ca] = stops[k], [b, cb] = stops[k + 1], t = (l - a) / (b - a || 1);
        for (let j = 0; j < 3; j++) im.data[i * 4 + j] = ca[j] + (cb[j] - ca[j]) * Math.min(1, Math.max(0, t));
        im.data[i * 4 + 3] = 255;
      }
      const off = document.createElement('canvas'); off.width = N; off.height = N; off.getContext('2d').putImageData(im, 0, 0);
      ctx.drawImage(off, 0, 0, W, W);
      // the HUD: a crosshair sweeping over the face, and a readout
      const cx = W * (0.5 + 0.09 * Math.sin(this.t / 18)), cy = W * (0.42 + 0.06 * Math.cos(this.t / 23));
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.2;
      const s = W * 0.14;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s + 10); ctx.lineTo(cx - s, cy - s); ctx.lineTo(cx - s + 10, cy - s);
      ctx.moveTo(cx + s - 10, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx + s, cy - s + 10);
      ctx.moveTo(cx - s, cy + s - 10); ctx.lineTo(cx - s, cy + s); ctx.lineTo(cx - s + 10, cy + s);
      ctx.moveTo(cx + s - 10, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx + s, cy + s - 10);
      ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6);
      ctx.stroke();
      ctx.font = 'bold ' + Math.max(9, W / 34) + 'px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillText('TGT 01  ' + (36.4 + (this.t % 7) / 10).toFixed(1) + '°C', 8, 16);
      ctx.fillText('LOCK ' + (this.t % 20 < 10 ? '■' : '□'), W - Math.max(9, W / 34) * 5, 16);
    },
    draw_ghost(ctx, W) {
      ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, W);
      const cols = Math.max(30, Math.round(W / 6.2));
      const cw = W / cols, ch = cw * 1.9;
      ctx.font = 'bold ' + (ch * 0.95) + 'px monospace';
      ctx.textBaseline = 'top';
      const rows = Math.ceil(W / ch);
      for (let y = 0; y < rows; y++) {
        let line = '';
        for (let x = 0; x < cols; x++) line += ASCII[Math.min(ASCII.length - 1, Math.floor(this.L((x + 0.5) / cols, (y + 0.5) * ch / W) * ASCII.length))];
        ctx.fillStyle = '#e8e8e8';
        // the font may not be exactly cw wide: draw char by char for a clean grid
        for (let x = 0; x < cols; x++) if (line[x] !== ' ') ctx.fillText(line[x], x * cw, y * ch);
      }
    },
  };
  window.Photo = P;
})();

// ==== diagrams.js ====
// Vector diagrams of the work, drawn from small descriptions: boxes, groups, and links along which the data
// moves. Data flows as dots, leaks flow in the warning colour, and a blocked flow stops at a shield.
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const esc = (s) => String(s === undefined ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  let uid = 0;

  /** where a link leaves or enters a box: the edge facing the other end, or a named side */
  function anchor(n, toward, side) {
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    if (!side) {
      const dx = toward.x - cx, dy = toward.y - cy;
      side = Math.abs(dx) * n.h > Math.abs(dy) * n.w ? (dx > 0 ? 'r' : 'l') : dy > 0 ? 'b' : 't';
    }
    return { r: [n.x + n.w, cy, 1, 0], l: [n.x, cy, -1, 0], b: [cx, n.y + n.h, 0, 1], t: [cx, n.y, 0, -1] }[side];
  }
  function path(a, b, bend) {
    const [x1, y1, dx1, dy1] = a, [x2, y2, dx2, dy2] = b;
    const d = Math.max(24, Math.hypot(x2 - x1, y2 - y1) * (bend === undefined ? 0.4 : bend));
    return `M${x1},${y1} C${x1 + dx1 * d},${y1 + dy1 * d} ${x2 + dx2 * d},${y2 + dy2 * d} ${x2},${y2}`;
  }

  /**
   * spec: {w, h, title, nodes: [{id, x, y, w, h, t, s (sub), k: 'box'|'chip'|'mem'|'actor'|'pill'|'shield', c: tone}],
   *        groups: [{x, y, w, h, t}], links: [{a, b, t, k: 'data'|'leak'|'ctrl'|'block', as, bs, bend, n (dots), dur}],
   *        notes: [{x, y, t, c, a}]}
   * tones: 'a' (accent), 'b' (accent2), 'w' (warning / attacker), 'd' (dim)
   */
  function render(spec) {
    const id = 'dg' + (++uid);
    const nodes = new Map(spec.nodes.map((n) => [n.id, n]));
    const out = [];
    out.push(`<svg class="dg" viewBox="0 0 ${spec.w || 640} ${spec.h || 300}" role="img" aria-label="${esc(spec.title || 'diagram')}" xmlns="${NS}">`);
    out.push(`<defs><marker id="${id}-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head"/></marker>
      <marker id="${id}-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head w"/></marker>
      <pattern id="${id}-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 L0,0 0,16" class="dg-grid"/></pattern>
      <filter id="${id}-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`);
    out.push(`<rect width="100%" height="100%" fill="url(#${id}-grid)" class="dg-bg"/>`);
    for (const g of spec.groups || []) out.push(`<g class="dg-group"><rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="10"/><text x="${g.x + 10}" y="${g.y + 15}">${esc(g.t)}</text></g>`);
    // links under the boxes, their labels above everything
    const labels = [];
    (spec.links || []).forEach((l, i) => {
      const A = nodes.get(l.a), B = nodes.get(l.b);
      if (!A || !B) return;
      const a = anchor(A, { x: B.x + B.w / 2, y: B.y + B.h / 2 }, l.as), b = anchor(B, { x: A.x + A.w / 2, y: A.y + A.h / 2 }, l.bs);
      const d = path(a, b, l.bend);
      const k = l.k || 'data';
      const pid = id + '-p' + i;
      out.push(`<path id="${pid}" d="${d}" class="dg-link ${k}" marker-end="url(#${id}-${k === 'leak' || k === 'block' ? 'arw' : 'ar'})"/>`);
      if (k !== 'ctrl') {
        const n = l.n || 3, dur = l.dur || 2.6;
        for (let j = 0; j < n; j++) {
          out.push(`<circle r="${k === 'leak' || k === 'block' ? 2.6 : 3}" class="dg-dot ${k}" filter="url(#${id}-glow)"><animateMotion dur="${dur}s" begin="${(-dur * j / n).toFixed(2)}s" repeatCount="indefinite" ${k === 'block' ? 'keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"' : ''}><mpath href="#${pid}"/></animateMotion>${k === 'block' ? `<animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="${dur}s" begin="${(-dur * j / n).toFixed(2)}s" repeatCount="indefinite"/>` : ''}</circle>`);
        }
      }
      if (l.t) labels.push(() => {
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        out.push(`<text x="${mx + (l.tx || 0)}" y="${my + (k === 'block' ? -17 : -6) + (l.ty || 0)}" class="dg-ltext ${k}" text-anchor="middle">${esc(l.t)}</text>`);
      });
      if (k === 'block') {
        const mx = (a[0] + b[0]) / 2 + (l.sx || 0), my = (a[1] + b[1]) / 2 + (l.sy || 0);
        out.push(`<g class="dg-shield" transform="translate(${mx},${my})"><path d="M0,-11 L9,-7 L9,1 C9,7 4,10 0,12 C-4,10 -9,7 -9,1 L-9,-7 Z"/><path d="M-4,0 L-1,3 L4,-3" class="tick"/></g>`);
      }
    });
    for (const n of spec.nodes) {
      const tone = n.c || 'a';
      const cls = 'dg-node ' + (n.k || 'box') + ' ' + tone;
      const cx = n.x + n.w / 2;
      const lines = String(n.t || '').split('\n');
      const ty = n.y + n.h / 2 - (lines.length - 1) * 6.5 + (n.s ? -5 : 4);
      let shape;
      if (n.k === 'mem') shape = `<path d="M${n.x},${n.y + 6} C${n.x},${n.y - 2} ${n.x + n.w},${n.y - 2} ${n.x + n.w},${n.y + 6} L${n.x + n.w},${n.y + n.h - 6} C${n.x + n.w},${n.y + n.h + 2} ${n.x},${n.y + n.h + 2} ${n.x},${n.y + n.h - 6} Z"/><path d="M${n.x},${n.y + 6} C${n.x},${n.y + 14} ${n.x + n.w},${n.y + 14} ${n.x + n.w},${n.y + 6}" class="lid"/>`;
      else if (n.k === 'actor') shape = `<circle cx="${cx}" cy="${n.y + n.h / 2}" r="${Math.min(n.w, n.h) / 2}"/>`;
      else if (n.k === 'chip') shape = `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5"/>` + [0.25, 0.5, 0.75].map((f) => `<path d="M${n.x + n.w * f},${n.y - 4} v4 M${n.x + n.w * f},${n.y + n.h} v4" class="pin"/>`).join('');
      else shape = `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.k === 'pill' ? n.h / 2 : 8}"/>`;
      // text that would not fit its box is drawn smaller, never spilling over the edge
      const room = (n.k === 'actor' ? Math.min(n.w, n.h) * 0.92 : n.w) - 10;
      const fit = (str, base, k) => Math.max(7, Math.min(base, room / Math.max(1, String(str).length * k)));
      const ts = Math.min(...lines.map((l) => fit(l, 11.5, 0.64)));
      const ss = n.s ? fit(n.s, 9.5, 0.62) : 0;
      out.push(`<g class="${cls}">${shape}${lines.map((l, i) => `<text x="${cx}" y="${ty + i * 13}" text-anchor="middle" class="t" style="font-size:${ts.toFixed(1)}px">${esc(l)}</text>`).join('')}${n.s ? `<text x="${cx}" y="${n.y + n.h / 2 + 10 + (lines.length - 1) * 6.5}" text-anchor="middle" class="s" style="font-size:${ss.toFixed(1)}px">${esc(n.s)}</text>` : ''}</g>`);
    }
    for (const f of labels) f();
    for (const t of spec.notes || []) out.push(`<text x="${t.x}" y="${t.y}" class="dg-note ${t.c || ''}" text-anchor="${t.a || 'start'}">${esc(t.t)}</text>`);
    out.push('</svg>');
    return `<figure class="dgfig">${out.join('')}${spec.caption ? `<figcaption>${esc(spec.caption)}</figcaption>` : ''}</figure>`;
  }

  window.Diagrams = { render, specs: {} };
})();

// A small shell for those who would rather type: help, ls, open, papers, theme, whoami...
(function () {
  'use strict';
  const T = {
    el: null, out: null, input: null, hist: [], hi: 0,
    build() {
      this.el = document.getElementById('term');
      this.el.innerHTML = '<div class="bar"><span>jm-sh: type help</span><button aria-label="Close the terminal">✕</button></div><div class="out" aria-live="polite"></div><div class="in"><span>guest@jyotiprakash.org:~$</span><input aria-label="Command" autocomplete="off" spellcheck="false" autocapitalize="off"></div>';
      this.out = this.el.querySelector('.out');
      this.input = this.el.querySelector('input');
      this.el.querySelector('.bar button').addEventListener('click', () => this.close());
      this.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { const v = this.input.value; this.input.value = ''; this.run(v); }
        else if (e.key === 'ArrowUp') { if (this.hi > 0) this.input.value = this.hist[--this.hi] || ''; e.preventDefault(); }
        else if (e.key === 'ArrowDown') { this.input.value = this.hist[++this.hi] || ''; if (this.hi > this.hist.length) this.hi = this.hist.length; e.preventDefault(); }
        else if (e.key === 'Tab') { e.preventDefault(); this.complete(); }
      });
      this.print('Welcome. This is a toy shell over this page. Try: help, ls, cat thesis, papers spectre, open strux, theme amber.\n');
    },
    open() { if (!this.el) this.build(); this.el.hidden = false; this.input.focus(); },
    close() { if (this.el) this.el.hidden = true; },
    print(s, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s; this.out.appendChild(d); this.out.scrollTop = this.out.scrollHeight; },
    complete() {
      const v = this.input.value, words = Object.keys(this.cmds).concat(Object.keys(window.App.SECTIONS), (window.App.data.tools.tools || []).map((t) => t.id), window.App.THEMES.map((t) => t.id));
      const parts = v.split(' '), last = parts.pop();
      const m = words.filter((w) => w.startsWith(last));
      if (m.length === 1) { parts.push(m[0]); this.input.value = parts.join(' ') + ' '; } else if (m.length) this.print(m.join('  '));
    },
    run(line) {
      line = line.trim();
      this.print('$ ' + line, 'p');
      if (!line) return;
      this.hist.push(line); this.hi = this.hist.length;
      const [c, ...a] = line.split(/\s+/);
      const f = this.cmds[c.toLowerCase()];
      if (!f) { this.print(c + ': command not found. Type help.', 'e'); return; }
      try { f.call(this, a); } catch (e) { this.print('error: ' + e.message, 'e'); }
    },
    cmds: {
      help() { this.print('help                 this list\nls                   the sections\ncat <section>        open a section (research, papers, patents, books, tools, experience, education, teaching, contact, cv)\npapers [words]       list papers, or search them\nopen <tool>          open a teaching tool in a new tab\ntheme [name]         list or change the theme\nwhoami               who this is\ncontact              how to reach me\nrain <0-3>           how fast the rain falls (0 stops it)\nclear, exit'); },
      ls() { this.print(Object.keys(window.App.SECTIONS).map((k) => k + '/').join('  ')); },
      cat(a) { const k = (a[0] || '').replace(/\/$/, '').replace(/\.txt$/, ''); const alias = { thesis: 'research', phd: 'research', cv: 'cv', resume: 'cv' }; const s = alias[k] || k; if (!window.App.SECTIONS[s]) { this.print('cat: ' + (a[0] || '') + ': no such section', 'e'); return; } window.App.open(s); this.close(); },
      papers(a) {
        const q = a.join(' ').toLowerCase();
        const list = window.App.data.papers.filter((p) => !q || (p.title + ' ' + (p.keywords || []).join(' ') + ' ' + (p.glance || '')).toLowerCase().includes(q));
        if (!list.length) { this.print('no papers match "' + q + '"'); return; }
        list.forEach((p) => this.print((p.year || '----') + '  ' + (p.thesis ? 'phd' : p.status === 'published' ? '   ' : p.status === 'under review' ? 'rev' : 'acc') + '  ' + p.title));
        this.print(list.length + ' paper' + (list.length === 1 ? '' : 's') + '. cat papers to read them.');
      },
      open(a) {
        const id = (a[0] || '').toLowerCase();
        const t = (window.App.data.tools.tools || []).find((x) => x.id === id || x.name.toLowerCase().replace(/[^a-z0-9]/g, '') === id.replace(/[^a-z0-9]/g, ''));
        if (!t) { this.print('open: which tool? ' + (window.App.data.tools.tools || []).map((x) => x.id).join(' '), 'e'); return; }
        if (!t.url) { this.print(t.name + ' has no public link yet.'); return; }
        window.open(t.url, '_blank', 'noopener'); this.print('opening ' + t.url);
      },
      theme(a) { if (!a[0]) { this.print(window.App.THEMES.map((t) => t.id).join('  ')); return; } if (!window.App.setTheme(a[0].toLowerCase())) this.print('theme: no theme called ' + a[0], 'e'); },
      whoami() { const P = window.App.data.profile; this.print(P.name + '\n' + P.roles.join('\n') + '\n\n' + P.summary); },
      contact() { const c = window.App.data.profile.contact; this.print('email     ' + c.email + '\nlinkedin  ' + c.linkedin + '\ngithub    ' + c.github + '\nblog      ' + c.blog); },
      rain(a) { const v = Math.max(0, Math.min(3, Number(a[0]))); if (!Number.isFinite(v)) return; window.Rain.speed = v; this.print('rain speed ' + v); },
      clear() { this.out.innerHTML = ''; },
      exit() { this.close(); },
      sudo() { this.print('Nice try. This incident will be reported.', 'e'); },
      rm() { this.print('rm: permission denied. The papers stay.', 'e'); },
      vim() { this.print('You are now trapped in vim. Type exit to escape.'); },
      emacs() { this.print('A fine operating system. It lacks a good editor.'); },
      ssh() { this.print('Connection refused. Send an email instead: mail@jyotiprakash.org'); },
    },
  };
  window.Term = T;
})();

    return '@' + (p.kind === 'preprint' ? 'misc' : isJ ? 'article' : 'inproceedings') + '{' + key + ',\n' + f.map(([k, v]) => '  ' + k + ' = {' + v + '}').join(',\n') + '\n}';

  // ---- themes, the typed prompt, the boot ----------------------------------------------------------------------------------
  function theme() { return document.documentElement.dataset.theme; }
  function setTheme(id, quiet) {
    if (!THEMES.some((t) => t.id === id)) return false;
    document.documentElement.dataset.theme = id;
    store.set('theme', id);
    document.querySelectorAll('#themes button').forEach((b) => b.classList.toggle('on', b.dataset.theme === id));
    const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (window.Rain && window.Rain.ctx) window.Rain.theme();
    if (window.Photo) window.Photo.set(id);
    if (!quiet) flash();
    return true;
  }
  function flash() { const e = $('#crt'); if (!e || matchMedia('(prefers-reduced-motion: reduce)').matches) return; e.animate([{ background: 'rgba(255,255,255,0.08)' }, { background: '' }], { duration: 260 }); }
  function themeButtons() {
    $('#themes').innerHTML = THEMES.map((t, i) => `<button data-theme="${t.id}" title="Theme: ${t.name} (key ${i + 1})"><i style="background:${t.dot}"></i>${t.name}</button>`).join('');
    $('#themes').addEventListener('click', (e) => { const b = e.target.closest('button[data-theme]'); if (b) setTheme(b.dataset.theme); });
  }
  function typed() {
    const lines = ['whoami', 'cat research/thesis.txt', 'ls papers/ | wc -l', 'open strux', 'grep -r "side channel" .', 'make teaching-tools', 'sudo make me a sandwich'];
    const el = $('#typed');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = 'whoami'; return; }
    let k = 0, i = 0, del = false;
    const step = () => {
      const s = lines[k];
      if (!del) { i++; el.textContent = s.slice(0, i); if (i >= s.length) { del = true; return setTimeout(step, 2200); } }
      else { i--; el.textContent = s.slice(0, i); if (i <= 0) { del = false; k = (k + 1) % lines.length; } }
      setTimeout(step, del ? 28 : 70 + Math.random() * 60);
    };
    step();
  }
  function boot(done) {
    let seen = false;
    try { seen = sessionStorage.getItem('jp.booted') === '1'; sessionStorage.setItem('jp.booted', '1'); } catch (e) { seen = true; }
    if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]noboot/.test(location.search) || location.hash) { done(); return; }
    const b = $('#boot');
    b.classList.add('on');
    const pub = papers.filter((p) => p.status !== 'under review').length;
    const L = ['JM-BIOS v2026.10  (c) Jyotiprakash Mishra', 'CPU: RISC-V rv64gc, BOOM out-of-order, side channels: being closed', '',
      '[ ok ] mounting /research ............ PhD thesis, BITS Pilani',
      '[ ok ] mounting /papers .............. ' + pub + ' published, ' + byStatus('under review').length + ' under review',
      '[ ok ] mounting /patents ............. ' + patents.length + ' published',
      '[ ok ] mounting /books ............... ' + books.length + ' with De Gruyter Brill',
      '[ ok ] starting teaching tools ....... ' + tools.map((t) => t.name.toLowerCase().replace(/[^a-z0-9]/g, '')).join(' '),
      '[ ok ] loading 16 years of experience', '', 'press any key'];
    let i = 0, stop = false;
    const end = () => { if (stop) return; stop = true; b.classList.add('out'); setTimeout(() => { b.classList.remove('on', 'out'); b.textContent = ''; }, 360); done(); };
    const tick = () => { if (stop) return; if (i < L.length) { b.textContent += L[i++] + '\n'; setTimeout(tick, 75); } else setTimeout(end, 500); };
    window.addEventListener('keydown', end, { once: true });
    b.addEventListener('click', end, { once: true });
    tick();
  }

  // ---- wiring ------------------------------------------------------------------------------------------------------------------
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) { if (current) close(); return; }
    const [k, id] = h.split('/');
    if (SECTIONS[k]) open(k, id, false);
  }
  function wire() {
    document.addEventListener('click', (e) => {
      const o = e.target.closest('[data-open]');
      if (o) { e.preventDefault(); open(o.dataset.open); return; }
      const j = e.target.closest('[data-jump]');
      if (j) { e.preventDefault(); const [k, id] = j.dataset.jump.split('/'); open(k, id); return; }
      const hd = e.target.closest('.item > button.head');
      if (hd) { toggle(hd.parentNode); return; }
      const bb = e.target.closest('[data-bib]');
      if (bb) { const p = papers.find((x) => x.id === bb.dataset.bib); copy(bibtex(p), bb); return; }
      const cp = e.target.closest('[data-copy]');
      if (cp) { copy(cp.dataset.copy, cp); return; }
      if (e.target.id === 'printCV') { window.print(); return; }
      if (e.target.id === 'openTerm') { window.Term.open(); }
    });
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toUpperCase();
      if (e.key === 'Escape') { if (!$('#term').hidden) { window.Term.close(); return; } if (current) { close(); return; } }
      if (/INPUT|TEXTAREA/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '`' || e.key === '~' || e.key === ':') { e.preventDefault(); window.Term.open(); return; }
      if (e.key === '/' && current && $('#sheetSearch')) { e.preventDefault(); $('#sheetSearch').focus(); return; }
      if (/^[1-7]$/.test(e.key) && !current) { setTheme(THEMES[+e.key - 1].id); return; }
      const keys = { r: 'research', p: 'papers', t: 'tools', b: 'books', x: 'experience', e: 'education', c: 'contact' };
      if (!current && keys[e.key]) open(keys[e.key]);
    });
    window.addEventListener('hashchange', route);
    // printing always gives the full CV, whatever is on screen
    window.addEventListener('beforeprint', () => { if (current !== 'cv') open('cv'); });
  }
  function copy(text, btn) {
    const ok = () => { if (btn) { const t = btn.textContent; btn.textContent = 'copied'; setTimeout(() => { btn.textContent = t; }, 1200); } };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok, ok); else ok();
  }
  function footer() {
    $('#foot').innerHTML = `<span>© 2026 Jyotiprakash Mishra · <a href="mailto:${esc(P.contact.email)}">${esc(P.contact.email)}</a></span>
      <span>keys: <kbd>1</kbd>–<kbd>7</kbd> themes · <kbd>p</kbd> papers · <kbd>t</kbd> tools · <kbd>\`</kbd> <button id="openTerm">terminal</button> · <kbd>esc</kbd> close</span>`;
  }

  window.App = { open, close, setTheme, THEMES, SECTIONS, bibtex, data: D };
  function start() {
    themeButtons();
    const saved = store.get('theme', null);
    setTheme(THEMES.some((t) => t.id === saved) ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'matrix'), true);
    home(); footer(); wire(); typed();
    window.Rain.start();
    boot(() => { 
      route(); 
      window.__siteReady = true; 
      if (typeof window.Gallery3D === 'function') {
        window.galleryInstance = new window.Gallery3D('gallery3d');
      }
      const viewToggle = document.getElementById('viewToggle');
      const gWrapper = document.getElementById('gallery3dWrapper');
      const gridWrapper = document.getElementById('grid2dWrapper');
      const toggleText = document.getElementById('viewToggleText');
      let is3D = true;
      if (viewToggle) {
        viewToggle.addEventListener('click', () => {
          is3D = !is3D;
          if (is3D) {
            gWrapper.style.display = 'flex';
            gridWrapper.style.display = 'none';
            toggleText.textContent = '2D Grid View';
            if (window.galleryInstance) window.galleryInstance.updateTheme();
          } else {
            gWrapper.style.display = 'none';
            gridWrapper.style.display = 'block';
            toggleText.textContent = '3D Space View';
          }
        });
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
