s and non-volatile systems."],"keywords":["memory encryption","cold boot attacks","bus sniffing","integrity protection","hardware security","side-channel attacks"],"abstract":"Memory encryption is a key security requirement for modern computing systems, addressing vulnerabilities between CPUs and main memory. Traditional storage encryption is insufficient for protecting volatile data in RAM, which remains exposed to bus sniffing, cold boot attacks, and side-channel exploits. This paper therefore systematically reviews memory encryption techniques focused on hardware-based solutions like Intel Total Memory Encryption (TME), Multi-Key TME, and AMD Secure Memory Encryption, which provide robust protection while minimising performance overhead. The paper also explores integrity protection via Merkle trees and side-channel countermeasures against Differential Power Analysis and Simple Power Analysis attacks. Additionally, granular memory encryption methods for multi-tenant environments are discussed, highlighting their role in isolating sensitive data across security domains. By examining security guarantees and performance trade-offs, we emphasise the necessity of efficient memory encryption to safeguard against evolving threats targeting the CPU-memory interface, providing hardware engineers a foundation for ensuring data confidentiality and integrity.","kind":"review","impact":33},{"id":"cmo-coherency-smartcom","title":"Formal Verification of Software-Managed Cache Coherency for RISC-V Heterogeneous Embedded Systems","authors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"venue":"Smart Trends in Computing and Communications (SmartCom), Lecture Notes in Networks and Systems, Vol. 1997, Springer, pp. 430-442","venueShort":"SmartCom (Springer LNNS)","year":2026,"publishedOnline":"2026-07-10","status":"published","indexing":"Scopus","doi":"10.1007/978-3-032-27563-9_40","url":"https://doi.org/10.1007/978-3-032-27563-9_40","pages":"430-442","glance":"A formal model of when RISC-V cache flushes are needed around DMA, plus an optimizer that removes the redundant ones.","problem":"Many embedded chips use DMA engines that bypass the CPU caches, so software must issue cache management operations (CMOs) by hand. The RISC-V Zicbom extension provides CBO.CLEAN, CBO.INVAL and CBO.FLUSH for this. A missing CMO causes stale reads or lost writes that silently corrupt data. Flushing before every DMA transfer is safe but slow in latency-sensitive code such as audio, sensor fusion and accelerator offload.","why":"CMO placement was guided by informal rules and manual reasoning. Hardware coherence protocols such as MESI do not apply to non-coherent DMA, and memory-model verification tools target thread-to-thread synchronization, not CPU-to-device coherency. The paper fills this gap with a formal treatment that says exactly which CMOs are required.","approach":"The system is modeled as a transition system with per-line cache states Invalid, Clean and Dirty, CPU loads and stores, the three Zicbom CMOs, and DMA reads and writes that bypass the cache. The paper proves necessary and sufficient preconditions for a safe DMA write (every cached copy invalid) and a safe DMA read (no dirty copy). It builds a coherency monitor automaton, proves that verification is decidable for bounded programs, and proves a compositionality result that lets addresses be checked independently. A forward and backward dataflow analysis then removes redundant CMOs and downgrades FLUSH to CLEAN or INVAL where possible. The model and optimizer were implemented in about 2,500 lines of Python and run on six embedded DMA benchmarks.","results":["Across six benchmarks the optimizer cut CMOs from 1,232 to 508, a 58.8% reduction, and every optimized program was verified coherent.","Reduction ranged from 25.0% (double buffering) to 83.3% (accelerator offload); producer-consumer reached 70.8%.","Estimated cycle cost of CMOs fell by 26.6% on average and by up to 57.6% (accelerator offload), using 50/10/60-cycle costs for CLEAN/INVAL/FLUSH.","Minimal CMO choice is proved: INVAL before a DMA write, CLEAN before a DMA read; FLUSH is never minimal.","Verification is decidable in O(3^(|P|x|A|) x |pi|) time for bounded programs, and address partitioning reduces this to O(k x 3^(|P|x n/k)).","The optimizer runs in time linear in program size, O(|pi| x |P| x |A|); the full benchmark suite ran in about 53 seconds."],"contributions":["An automata-based formal model of software-managed cache coherency for RISC-V with Zicbom and non-coherent DMA.","Necessary and sufficient conditions for safe DMA writes and reads (Theorems 1 and 2) and the minimal CMO for each case.","A coherency monitor automaton with a proof that coherency verification is decidable for bounded programs.","A compositionality theorem that allows verification address by address.","A sound dataflow algorithm that removes redundant CMOs, evaluated on six embedded DMA benchmarks."],"keywords":["Cache coherency","RISC-V","DMA","Formal verification","Automata","Embedded systems","Zicbom"],"abstract":"Modern embedded systems increasingly rely on non-coherent DMA to reduce hardware complexity, requiring explicit software management of cache coherency through Cache Management Operations (CMOs). We present a formal automata-based model for software-managed cache coherency in RISC-V systems with the Zicbom extension. Our model precisely characterizes the necessary and sufficient conditions for safe DMA operations, proves that coherency verification is decidable for bounded programs, and provides a sound dataflow-based algorithm for eliminating redundant CMOs. Evaluation on six embedded benchmarks demonstrates 58.8% average CMO reduction with verified coherency maintenance.","kind":"conference","impact":20},{"id":"rv-josh-smartcom","title":"RV-JOSH: A Hardened Operating System for RISC-V based on Java","authors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"venue":"Smart Trends in Computing and Communications (SmartCom), Lecture Notes in Networks and Systems, Vol. 1991, Springer, pp. 390-401","venueShort":"SmartCom (Springer LNNS)","year":2026,"publishedOnline":"2026-08-02","status":"published","indexing":"Scopus","doi":"10.1007/978-3-032-27754-1_36","url":"https://doi.org/10.1007/978-3-032-27754-1_36","pages":"390-401","glance":"A RISC-V operating system with a Java kernel, built-in malware detection and side-channel resistant memory encryption.","problem":"RISC-V is spreading into IoT and embedded devices, but those platforms need protection against malware and against memory attacks such as power analysis on encryption keys. Operating system kernels are written in C and assembly, which makes them hard for new developers to change and open to memory-safety bugs. Security features also have to be wired into large, tightly coupled code bases such as Linux.","why":"The paper cites the difficulty of evolving Linux, including the rejection of RISC-V changes for Linux 6.17 over code quality and the Rust-for-Linux maintainer resignations. Earlier Java operating systems such as JNode and JX showed the idea is feasible but have been dormant for a decade and offer no malware detection or memory encryption for RISC-V. User-space malware detectors can add delays above 100 ms, which leaves room for evasion.","approach":"RV-JOSH runs a JVM on bare-metal RISC-V, with the kernel written in Java and calling a thin C and assembly layer through JNI; Java class files load directly as OS processes. A static detector scans bytecode at process creation, extracts 1-gram and 2-gram opcode features and classifies them with a random forest and a neural network. A runtime detector samples ten new QEMU performance monitors (basic-block size, branch density, memory access pattern, instruction mix, code-page writes, syscall frequency, jump targets, hot paths, memory span, NOP runs) and feeds HMM, LSTM and Isolation Forest models. A page-level memory encryption module supports AES-256, ASCON-128a and ChaCha20-Poly1305 with PUF-derived keys, constant-time code against SPA and periodic rekeying against first-order DPA. QEMU was also extended with an encrypted page cache so plaintext never appears in guest memory.","results":["Kernel boot takes 22-38 ms on qemu-system-riscv64 10.0.2; JVM initialization (8-12 ms) and crypto engine setup (5-8 ms) dominate.","Software encryption throughput without rekeying: ChaCha20 798.5 MB/s, ASCON-128 402.8 MB/s, AES-128 151.2 MB/s.","Rekeying every 5 operations lowers ChaCha20 read throughput to 656.1 MB/s; rekeying every 100 operations keeps it at 783.6 MB/s.","Static detection latency: neural network 0.263 ms per sample (3,793 samples/s); random forest with 128 trees 39.3 ms (25 samples/s).","Dynamic detection latency: LSTM 0.81 ms, HMM 0.788 ms, Isolation Forest 10.5 ms per sample.","Models were evaluated on synthetic data (10,000 static samples with 256 features; 50,000 dynamic samples with 10 counter features), since no real Java malware dataset for RISC-V exists."],"contributions":["A RISC-V operating system with a Java kernel and minimal C and assembly, where Java classes load directly as processes.","A hybrid malware detection framework combining static bytecode n-gram analysis with runtime hardware-counter monitoring.","Ten additional QEMU performance monitors for behavioral malware analysis.","A page-level memory encryption module with selective encryption and configurable rekeying, designed to resist SPA and DPA on IoT-class devices."],"keywords":["Security","Operating Systems","RISC-V","Java","Memory Encryption","Malware Detection","QEMU"],"abstract":"RISC-V's open architecture has gained wide adoption, but ensuring platform security remains challenging. We present a RISC-V operating system with a Java-based kernel using JNI for low-level services. User processes written in Java can be directly loaded as OS processes, lowering development barriers. The system includes malware detection combining static bytecode analysis with runtime monitoring. Static analysis extracts n-gram opcode features classified using random forest and neural network models. Runtime detection uses extended hardware performance counters via QEMU augmentation. A page-level memory encryption module provides resistance to Simple and Differential Power Analysis using selective encryption and periodic rekeying for IoT device constraints. The result is a RISC-V platform combining accessible OS development with multi-layered protection.","kind":"conference","impact":21},{"id":"cache-spec-review-ict4sd","title":"Cache and Speculative Side Channel Attacks: A Comprehensive Review","authors":["Jyotiprakash Mishra","Sanjay K. Sahay","Aman Pathak"],"venue":"ICT Systems and Sustainability (ICT4SD 2025), Lecture Notes in Networks and Systems, Springer, Vol. 2 of the proceedings, pp. 219-233","venueShort":"ICT4SD 2025 (Springer LNNS)","year":2025,"publishedOnline":"2025-10-08","status":"published","indexing":"Scopus","doi":"10.1007/978-3-032-06665-7_21","url":"https://doi.org/10.1007/978-3-032-06665-7_21","pages":"219-233","glance":"A survey of cache timing and transient-execution attacks, from Spectre to Apple Silicon, and their defenses.","problem":"Speculative execution, branch prediction, prefetching and shared caches make processors fast but leave measurable traces of secret data. Since Spectre and Meltdown, almost every microarchitectural structure has been turned into a leak. Vendors shipped patches quickly, but these cost performance and did not remove the root causes; KPTI alone costs about 5% on average and up to 30% in the worst case.","why":"The attack literature grew fast and spread across x86, ARM, Apple Silicon and GPUs, with new vectors such as data memory-dependent prefetchers, load value prediction and GPU compression channels. Researchers and architects needed one place that explains the mechanisms, where each attack works, and why existing mitigations fall short, so that the next defenses can be both secure and cheap.","approach":"The review first explains the hardware features that leak: out-of-order and speculative execution, the branch target buffer, the return stack buffer, store-to-load forwarding and deferred page-permission checks. It then classifies attacks into classical access-based attacks (Flush+Reload, Prime+Probe, Flush+Flush, CacheBleed), the Meltdown and Spectre families and newer variants: EFLAGS-based timing, load address and load value prediction (Apple Silicon), post-barrier Spectre, cross-cache kernel heap exploits, branch target injection, the GoFetch data memory-dependent prefetcher, GPU compression channels, cross-VM, browser and TEE attacks. Mitigations are grouped into partitioning and isolation, randomization, speculative fences and microcode, compiler hardening, ML-based runtime detection and timer obfuscation, followed by OS and vendor patches such as KASLR, KPTI, retpoline, Foreshadow and MDS fixes, and browser timer changes.","results":["Organizes the field into 16 attack classes, from classical cache timing to GPU compression and TEE-focused attacks.","Groups defenses into six mitigation patterns and six families of OS and vendor patches.","Finds that most deployed mitigations carry a performance cost and do not fully close the underlying channels.","Identifies directions for future work: architectural isolation of critical contexts, dynamic detection, formal verification of security-critical CPU parts, and cross-layer collaboration."],"contributions":["An architecture-agnostic survey tracing attacks from Spectre to recent Apple Silicon attacks.","A description of the microarchitectural features that each attack class exploits.","A taxonomy of mitigation patterns across operating systems, hardware and compilers, with their limitations.","A reference for hardware researchers designing defenses with low performance overhead."],"keywords":["Cache side-channel","Speculative execution","Microarchitectural vulnerabilities","Security"],"abstract":"Modern processors have achieved significant performance enhancements through the implementation of speculative execution. These enhancements stem from hardware optimizations that not only improve performance but also introduce side channels, which are exploited to undermine the system's security model. Following the discovery of Spectre, which revealed that speculative execution pipelines could bypass security boundaries, nearly all microarchitectural structures and hardware optimizations have become targets for exploitation. In the wake of these attacks, the immediate response from organizations releasing mitigation patches led to noticeable performance degradation overnight, without fully addressing the underlying issues. This paper provides a comprehensive review of architecture-agnostic attacks on modern computing systems, tracing their evolution from the initial emergence of Spectre to contemporary attacks targeting Apple Silicon. We detail the mechanisms of these attacks, the environments in which they are exploited, and their broader security implications. Furthermore, we analyze various mitigation strategies that have been proposed, acknowledging that these strategies often fail to fully resolve the issues and typically incur a performance cost. These mitigation patterns include proposed changes in operating systems, hardware, and compilers. This review aims to provide researchers and architects with the foundational knowledge needed to develop more effective mitigation strategies that address the vulnerabilities while minimizing performance overhead.","kind":"review","impact":32},{"id":"riscv-hw-security-review-ict4sd","title":"A Hardware Security Review of RISC-V","authors":["Jyotiprakash Mishra","Sanjay K. Sahay","Aman Pathak"],"venue":"ICT Systems and Sustainability (ICT4SD 2025), Lecture Notes in Networks and Systems, Springer, Vol. 2 of the proceedings, pp. 409-422","venueShort":"ICT4SD 2025 (Springer LNNS)","year":2025,"publishedOnline":"2025-10-08","status":"published","indexing":"Scopus","doi":"10.1007/978-3-032-06665-7_38","url":"https://doi.org/10.1007/978-3-032-06665-7_38","pages":"409-422","glance":"A survey of attacks and defenses specific to RISC-V hardware, from cache side channels to fault injection.","problem":"RISC-V is an open, modular ISA now used from microcontrollers to data-center chips, and national programs in China (XiangShan) and India (SHAKTI, DIR-V) are investing in it. Its openness lets attackers study the design files, and it lacks standard security features that ARM and x86 have, such as a widely accepted TEE like TrustZone or SGX. This is a risk for finance, defense, medical and other security-critical uses.","why":"Side-channel, speculative and fault attacks were studied mostly on x86 and ARM, and their effect on RISC-V's modular design needed separate study. The RISC-V security work was spread across many papers on different cores and extensions. The authors wanted one review that maps known RISC-V vulnerabilities to proposed countermeasures, as a base for building secure RISC-V systems.","approach":"The review first surveys ten implementations: BOOM, CVA6, Shakti, StarFive VisionFive, SiFive processors, Rocket, PicoRV32, XiangShan, T-Head TH1520 and NEORV32. It then covers seven attack areas and their mitigations on RISC-V: cache and speculative side channels, power side channels (SPA, DPA, CPA), trusted execution environments (Sanctum, SMARTS, Dorami), secure boot and root of trust with PUFs, cryptographic ISA extensions including scalar AES and post-quantum accelerators, memory encryption, and electromagnetic fault injection.","results":["Surveys ten RISC-V implementations and seven attack-and-mitigation areas.","Notes that EMFI susceptibility rises at lower supply voltage and higher clock frequency, which makes fast RISC-V designs more exposed.","Reports a trace-verifier CFI defense against EMFI with 13.6% area, 3.5% memory and 9% power overhead.","Finds that RISC-V memory-encryption work is mostly FPGA-based and limited to single cores such as RocketChip, with little security analysis.","Concludes that the lack of standardized hardware security features in RISC-V remains a persistent risk, especially for IoT and low-power devices."],"contributions":["An overview of open-source and commercial RISC-V implementations relevant to security research.","A RISC-V specific map of attacks and mitigations across seven areas.","Identification of gaps, including the absence of a standard TEE and limited memory-encryption studies.","A starting point for researchers building secure RISC-V designs."],"keywords":["RISC-V","Hardware Security","Side-Channel Attacks","Speculative Execution"],"abstract":"RISC-V is an open-source Instruction Set Architecture (ISA) designed with a modular and extensible structure, allowing for customizable implementations. Its simplified base ISA, combined with optional standard and custom extensions, provides flexibility for a wide range of computing applications, from embedded systems to high-performance computing. Its open design accelerates innovation and customization but also introduces security challenges by exposing the architecture to potential attacks. While RISC-V offers significant advantages, its lack of standardized security features compared to proprietary ISAs like ARM and x86 highlights persistent risks, particularly in security-critical applications. For this reason, scrutiny of RISC-V's security is crucial due to its widespread use in academia and its adoption by countries like China and India, who are looking to benefit from its open nature. We review the current security challenges in RISC-V, examining key vulnerabilities that exist in areas such as the microarchitecture, trusted execution environments, secure enclaves, secure boot, cryptographic instruction set architectures, memory encryption, and electromagnetic fault injection attacks. This review aims to cater to the needs of modern researchers for the development and implementation of the RISC-V ISA in a secure manner.","kind":"review","impact":31},{"id":"modern-hw-security-arxiv","title":"Modern Hardware Security: A Review of Attacks and Countermeasures","authors":["Jyotiprakash Mishra","Sanjay K. Sahay"],"venue":"arXiv preprint arXiv:2501.04394 (cs.CR; cs.AR)","venueShort":"arXiv","year":2025,"submitted":"2025-01-08","status":"preprint","indexing":"arXiv","doi":"10.48550/arXiv.2501.04394","url":"https://arxiv.org/abs/2501.04394","pages":"25 pages","glance":"A 25-page review of hardware attacks and defenses: side channels, memory encryption, secure boot, PUFs, RISC-V.","problem":"Cloud services, smart devices and IoT have made hardware a common target. Attacks such as Spectre and Meltdown, power analysis, voltage glitching, electromagnetic analysis and fault injection extract secrets from the physical behavior of chips. Defending against them requires designers to understand many separate attack classes at once.","why":"Hardware security knowledge was scattered across cache side channels, power analysis, memory encryption, secure enclaves, cryptographic ISAs, secure boot, PUFs and fault injection, each with its own literature. The authors wrote one review that connects attacks to mitigations across these areas, with a dedicated section on RISC-V because its openness and extensibility raise new problems. It also served as the literature base for my doctoral work on RISC-V side-channel security.","approach":"The paper first explains the concepts behind each area: cache organization and side channels, power side channels (SPA, DPA, CPA, template attacks), memory encryption (confidentiality, granularity, key management, masking, rekeying), secure enclaves, cryptographic ISAs, secure boot and root of trust, PUFs and hardware fault injection. It then reviews attacks and their mitigations for speculative execution, DPA, memory, secure enclaves, secure boot and root of trust, and fault injection. A final section focuses on RISC-V: speculative execution, power analysis, memory encryption and cryptographic ISA extensions.","results":["Covers eight hardware security areas and pairs each attack class with its mitigation patterns.","Draws on a bibliography of 373 references.","Concludes that isolation, secure microcode updates, speculative execution controls, cache partitioning, randomized execution, masking and frequent rekeying are needed together.","My most cited work: 41 citations on Google Scholar and 27 on Semantic Scholar as of October 2026."],"contributions":["A single review spanning cache, power and EM side channels, memory encryption, enclaves, crypto ISAs, secure boot, PUFs and fault injection.","A structured pairing of attacks with countermeasures in each area.","A dedicated analysis of security challenges in the RISC-V architecture.","A reference for researchers and designers building side-channel resistant hardware."],"keywords":["Hardware Security","Cyber-security","Cache Side Channels","Cryptographic Instruction Set Extensions","Fault Injection","Memory Encryption","Power Analysis Attacks","RISC-V","Secure Boot","Side-Channel Resistant Design","Speculative Execution"],"abstract":"With the exponential rise in the use of cloud services, smart devices, and IoT devices, advanced cyber attacks have become increasingly sophisticated and ubiquitous. Furthermore, the rapid evolution of computing architectures and memory technologies has created an urgent need to understand and address hardware security vulnerabilities. In this paper, we review the current state of vulnerabilities and mitigation strategies in contemporary computing systems. We discuss cache side-channel attacks (including Spectre and Meltdown), power side-channel attacks (such as Simple Power Analysis, Differential Power Analysis, Correlation Power Analysis, and Template Attacks), and advanced techniques like Voltage Glitching and Electromagnetic Analysis to help understand and build robust cybersecurity defense systems and guide further research. We also examine memory encryption, focusing on confidentiality, granularity, key management, masking, and re-keying strategies. Additionally, we cover Cryptographic Instruction Set Architectures, Secure Boot, Root of Trust mechanisms, Physical Unclonable Functions, and hardware fault injection techniques. The paper concludes with an analysis of the RISC-V architecture's unique security challenges. The comprehensive analysis presented in this paper is essential for building resilient hardware security solutions that can protect against both current and emerging threats in an increasingly challenging security landscape.","kind":"preprint","impact":30},{"id":"drebin-duplicates-apcc","title":"Duplicates in the Drebin Dataset and Reduction in the Accuracy of the Malware Detection Models","authors":["Jyotiprakash Mishra","Sanjay K. Sahay","Hemant Rathore","Lokesh Kumar"],"venue":"26th IEEE Asia-Pacific Conference on Communications (APCC 2021), IEEE, pp. 161-165","venueShort":"IEEE APCC 2021","year":2021,"status":"published","indexing":"CORE C; IEEE Xplore; DBLP","doi":"10.1109/apcc49754.2021.9609892","url":"https://doi.org/10.1109/apcc49754.2021.9609892","pages":"161-165","glance":"Shows that over half of Drebin's Android malware samples are duplicates, which inflates reported detection accuracy.","problem":"Drebin is one of the most used Android malware datasets for training and comparing machine-learning detectors. If many malicious samples are copies of each other, the same app can appear in both training and test sets. Reported accuracy then measures memorization rather than detection of new malware.","why":"A frequency table of Dalvik opcodes in Drebin suggested an unusually large number of near-identical malicious files. Many published detectors reported high accuracy on Drebin without checking for this. The authors wanted to measure how many duplicates exist and how much they distort the reported results.","approach":"The authors used a fitting factor measure on opcode occurrence to find duplicate malicious files in Drebin. They then trained popular detectors with and without the duplicates, using all features, the top 26 features selected by Information Gain, and 26 features learned by an Auto-Encoder. Classifiers tested were Random Forest, Decision Tree, Bagging, Gradient Boost, XGBoost and a Deep Neural Network.","results":["51.57% of malicious samples in Drebin have one or more duplicates.","Random Forest accuracy drops by 4.2% with all features, 5.3% with the top 26 IG features and 8.8% with the AE features once duplicates are removed.","The largest drop, 12.2%, is for the Deep Neural Network with IG-selected features.","Conclusion: earlier reported Drebin-based detection accuracy is exaggerated and may mislead the field.","Cited 11 times on Google Scholar (10 on OpenAlex) as of October 2026."],"contributions":["Quantified duplication among Drebin malware samples using opcode-based fitting factor.","Measured the accuracy loss of six classical and deep classifiers after deduplication.","Compared the effect across three feature sets: all features, Information Gain and Auto-Encoder.","Raised a dataset-hygiene warning for Android malware detection research."],"keywords":["Android malware","Drebin","Duplicate samples","Dalvik opcodes","Machine learning","Deep learning","Malware detection"],"abstract":"The Android operating system has constantly remained in the limelight, hence attracts the attention of cyber-criminals. Understanding the rising challenges, many researchers have bagged achievements by applying machine/deep learning techniques for the construction of malware detection models based on popular Drebin malware datasets. However, a cursory look at a table of the frequency of Dalvik opcodes leads us to believe that this dataset may have a massive number of duplicate malicious files. Hence, we used a technique called fitting factor to find the duplicate malicious files in the Drebin datasets on the basis of opcodes occurrence. We found that 51.57% malicious samples in the datasets have one or more duplicates. Hence, accordingly, we studied the performance of the popular detection models with and without duplicates with all the features, top 26 features engineered by Information Gain (IG) and Auto-Encoder (AE). The experimental results show that one of the most popular classical classifiers, the Random Forest classifier, shows a decline in accuracy by 4.2%, 5.3% and 8.8% with all features, top 26 features obtained by IG and AE respectively. To establish the observed facts we further extensively experimented with Decision Tree, Bagging, Gradient Boost, XG Boost, and Deep Neural Network. The most significant decline (12.2%) in accuracy was observed in the Deep Neural Network classifier with the features obtained by IG, i.e., the earlier reported performance of the malware detection models based on Drebin data is exaggerated, and consequently it may lead to a wrong direction in this field of research.","kind":"conference","impact":22},{"id":"revisable-machine-descriptions","title":"Revisable Machine Descriptions: Twenty-Four Facts a Running Guest Can Be Told Again","year":2026,"status":"under review","kind":"journal"},{"id":"ternary-sigma-delta","title":"Straight-Through Training as Sigma-Delta Modulation: Exact Dither Penalties, Duty-Cycle Rounding, and Quantizer Design for Ternary Networks","year":2026,"status":"under review","kind":"journal"},{"id":"xv6-line-by-line","title":"xv6, Line by Line: A Verified, Interactive Commentary and Lab Curriculum for Training Kernel Developers","year":2026,"status":"under review","kind":"journal"},{"id":"near-miss-retrieval","title":"Near-Miss Retrieval: Contrastive Case Retrieval for Entity Disambiguation in Retrieval-Augmented Generation","year":2026,"status":"under review","kind":"conference"},{"id":"surprisal-time-series","title":"Surprisal Is a Time Series: Prequential Calibration Auditing of Language Models with Zero-Shot Forecasting Foundation Models","year":2026,"status":"under review","kind":"conference"},{"id":"parametric-knowledge-delta","title":"Parametric Knowledge Delta: Measuring, Compressing and Retrieving Knowledge Graphs Against a Language Model's Prior","year":2026,"status":"under review","kind":"conference"},{"id":"knowledge-certificates","title":"Knowledge Certificates: Distribution-Free Guarantees on Which Facts Survive Quantization","year":2026,"status":"under review","kind":"conference"}],"profiles":{"scholar":"https://scholar.google.com/citations?user=sE2dRWIAAAAJ","hIndex":2,"orcid":"https://orcid.org/0000-0001-7590-1215","scopus":"https://www.scopus.com/authid/detail.uri?authorId=57426637300","semantic":"https://www.semanticscholar.org/author/2182578895"},"thesis":{"title":"An Investigation of Side-Channel Security in Open-Source RISC-V Processors","degree":"Doctor of Philosophy","institution":"Birla Institute of Technology and Science (BITS) Pilani, K. K. Birla Goa Campus, Department of Computer Science and Information Systems","advisor":"Prof. Sanjay K. Sahay","year":2026,"status":"Thesis submitted (2026); degree award expected December 2026","glance":"Finds new side channels in open RISC-V cores, builds a fast emulator to test defenses, and designs a verified memory encryption engine.","problem":"RISC-V is open, extensible and being adopted at national scale, including India's SHAKTI and VEGA programmes. It ships without the standardized security hardening that decades of commercial pressure added to x86 and ARM, and many security-relevant behaviors (PMP, LR/SC atomics, WARL registers, performance counters) are implementation-defined. The side-channel posture of real open-source RISC-V cores was therefore largely unknown.","why":"Three gaps motivated the work. No study had systematically characterized RISC-V-specific side channels across many real cores and confirmed them on silicon. No tool could evaluate microarchitectural defenses at cycle-level fidelity and still boot Linux and run large sweeps in reasonable time. And no open RISC-V memory encryption design combined confidentiality, integrity and gate-level, formally verified higher-order masking at a deployable cost.","approach":"The thesis follows a discovery, evaluation and defense arc built on open, reproducible artifacts: published open cores, the Chipyard flow, cycle-model emulation and commodity Xilinx FPGA silicon. Discovery measures 23 side-channel classes on a six-core corpus with TVLA and confidence-bounded proofs of concept, then carries them to an FPGA. Evaluation builds ARCHER, an emulator calibrated against Chipyard RTL, to reproduce known attacks and compare defenses quickly. Defense designs PACE, a memory encryption engine whose masked core is proven secure by three formal tools and realized on FPGA.","thesisStatement":"The openness of the RISC-V instruction-set architecture makes the security of its implementations against side-channel attacks a problem that can, and therefore must, be addressed empirically and end-to-end: the architecture's distinctive features give rise to novel side channels that can be discovered and measured on real cores; those channels and their defences can be evaluated at cycle-model fidelity with open tooling; and the resulting defensive knowledge can be realised as formally verified, low-overhead hardware, closing the loop from discovery, through evaluation, to defence.","researchQuestions":["RQ1 (Discovery): Which side channels are specific to open-source RISC-V cores, how prevalent are they from in-order to wide out-of-order designs, and do they survive the move from simulation to silicon?","RQ2 (Evaluation): Can one emulation environment model microarchitectural timing faithfully enough to reproduce known attacks and evaluate defenses, yet run fast enough for large sweeps and full OS boots?","RQ3 (Defense): Can an in-line memory encryption engine for RISC-V provide confidentiality, integrity and formally verified nth-order power-analysis resistance at low overhead, validated on FPGA silicon?"],"chapters":[{"number":1,"title":"Introduction","summary":"Opens with how Meltdown and Spectre in 2018 moved trust below the software line, then explains why RISC-V's openness is both a strength and a new attack surface. It reviews microarchitectural and power side channels and why main memory sits outside the trust boundary. It states three gaps, three research questions and the thesis statement, and fixes the scope to hardware side channels on open cores.","results":["Three research questions organized as discovery, evaluation and defense.","Scope: microarchitectural timing and power leakage on open RISC-V; invasive and fault attacks excluded."]},{"number":2,"title":"Literature Review","summary":"Surveys cache and speculative-execution attacks, power and electromagnetic side channels, memory encryption and integrity, trusted execution, cryptographic ISAs, secure boot and fault injection. It then narrows to the RISC-V security literature. The synthesis argues the field is mature on closed x86 and ARM silicon but thin and largely unvalidated on real open RISC-V hardware.","results":["Identifies Gap 1: no silicon-validated study of RISC-V-specific channels.","Identifies Gap 2: no evaluation tool that is both cycle-faithful and fast.","Identifies Gap 3: no practical, formally verified memory encryption for RISC-V."]},{"number":3,"title":"Novel Side-Channel Attacks on Open-Source RISC-V Cores","summary":"Answers RQ1 by measuring 23 side-channel classes across Rocket, VexiiRiscv, CVA6 and three BOOM widths, plus two dual-hart SoCs. Six classes are new and come from RISC-V's own features such as PMP, WARL registers, the page-table-walker fault path and LR/SC reservations. Each channel is quantified with TVLA and Wilson confidence intervals and then confirmed on a Zedboard FPGA. Eight RTL and firmware mitigations close the channels at small measured area and power cost.","results":["23 channels: 6 novel (Tier A), 7 first cross-privilege RISC-V instances (Tier B), 10 known classes (Tier C).","PMPectre: PMP-denied loads forward speculatively on out-of-order cores, timing gap up to 126 cycles, zero faults raised.","84 unit-level silicon measurements and an 11-experiment whole-core battery; amplification 2.1x to 43x on silicon.","6 of 8 mitigations cost at most 0.8% LUT area; all 8 change dynamic power by under 2 mW."],"papers":["novel-riscv-sca"]},{"number":4,"title":"ARCHER: A Cycle-Accurate RISC-V Emulator for Side-Channel and Memory-Encryption Research","summary":"Answers RQ2 with ARCHER, an RV64IMAFDC emulator with pluggable in-order, out-of-order and SMT cores, coherent caches and up to 16 harts, all configured through INI files. It boots Linux 6.6 in under three minutes and is calibrated against Chipyard's fab-ready RTL. On it, ten classical attacks are reproduced and evaluated against thirteen speculation policies, seven of them new. It also hosts AMES, a bus-layer memory encryption engine that is the simulation precursor to PACE.","results":["3.7x faster than gem5 DerivO3CPU (geometric mean) on bare-metal microbenchmarks.","Mean 9.4% cycle-count deviation from Chipyard RTL at a median 88x host-throughput advantage over Verilator.","Every configured defense drives leakage to zero at under 0.3% IPC loss on a full Linux boot.","Seven new speculation-defense policies across three mechanism families."],"papers":["archer"]},{"number":5,"title":"PACE: A Page-Adaptive, DPA-Resistant Memory-Encryption Engine for RISC-V","summary":"Answers RQ3 with PACE, a TileLink engine placed between the last-level cache and memory that picks a protection policy per physical page from page-table bits. Counter-mode keystreams are precomputed while lines are cached, so evictions only XOR. Fresh re-keying and domain-oriented masking protect the engine's key against power analysis, and the masked Ascon-p S-box is proven secure by three formal tools. The engine runs on Rocket and BOOM and is placed, routed and programmed on a Xilinx XC7Z020.","results":["Writeback latency reduced 9x (90 to 10 cycles); with integrity, 320 to 10 cycles.","Masked core proven order-d secure by COCO, PROLEAD and SILVER (d = 1, 2), and by COCO through d = 3.","Application-level overhead within measurement noise of plaintext for cache-resident workloads; masking adds no cycles.","Measured trace-amplification exponents 1.92/3.70/5.40/6.97 match the predicted 2(d+1) law."],"papers":["pace"]},{"number":6,"title":"Conclusions and Future Work","summary":"Revisits the three research questions and answers each one affirmatively with the evidence of Chapters 3 to 5. It states the limits plainly: results are cycle-model-relative, rest on open cores and FPGAs rather than custom tape-outs, and PACE's DPA evidence is formal and simulated because the on-chip campaign is sensitivity-limited. It sets out future work on a physical break-then-fix, silicon-anchored calibration of ARCHER, and new RISC-V extensions.","results":["Future work: co-placed sensor array and 10^5 to 10^6 trace campaign for PACE.","Future work: extend discovery to vector, hypervisor and scalar-crypto extensions and to multi-socket coherence.","Future work: compose all eight mitigations on one core and measure combined cost."]}],"contributions":["A simulation-to-silicon characterization of 23 side-channel classes on six open RISC-V cores, six of them new primitives rooted in RISC-V-specific features.","Eight RTL and firmware mitigations with measured area, power, portability and software cost.","ARCHER, an open, INI-configurable cycle-level RISC-V emulator calibrated against Chipyard RTL, with seven new speculation-defense policies and the AMES memory encryption engine.","PACE, a page-adaptive, cache-anchored memory encryption engine with confidentiality, integrity and nth-order DPA resistance, formally verified at the netlist level and realized on FPGA.","Methodology: a three-tier novelty taxonomy, a statistical-validity treatment of TVLA with Wilson intervals, and a design checklist for RISC-V implementers."],"keyResults":["23 side channels across 6 cores; 6 have no x86 or ARM analogue.","PMPectre timing gap up to 126 cycles with zero architectural faults.","6 of 8 mitigations at no more than 0.8% LUT area; all 8 under 2 mW power change.","ARCHER: Linux boot under 3 minutes, 3.7x faster than gem5, 9.4% mean deviation from Chipyard RTL.","Classical Spectre-family defenses reach zero leakage at under 0.3% IPC loss.","PACE: 9x lower writeback latency; masked core proven secure through order 3; overhead within noise for cache-resident workloads."],"publications":["pace","archer","novel-riscv-sca"],"defenseStory":["Correct silicon is not safe silicon: the ISA fixes results, but timing, caches and predictors are left to the implementer, and that gap leaks.","RISC-V is open and spreading fast, but it has no standard side-channel hardening and several of its features are implementation-defined.","Discovery: 23 channels measured on six open cores, six of them new. PMP, the RISC-V memory protection unit, can be bypassed speculatively.","The channels are real: they reproduce on FPGA silicon, often stronger than in simulation, and eight small RTL fixes close them.","Evaluation: ARCHER boots Linux in under three minutes and tests a defense in minutes instead of hours, within 9.4% of real RTL timing.","Defense: PACE encrypts memory per page and hides the cipher's latency inside the cache, cutting writeback cost 9x.","Its key engine is masked and proven secure by three independent formal tools, then built on an FPGA.","Result: the security of an open ISA can be measured, reasoned about and built, at low cost."],"statusShort":"submitted"},"figures":[],"patents":[{"inventors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"applicant":"BITS Pilani","office":"Indian Patent Office","status":"Published patent application (not yet granted)","kind":"Indian patent application, Complete Specification (Form 2, Section 10, Patents Act 1970)","id":"dfi-monitor","title":"Hardware data-flow integrity monitor with register-file provenance tagging for RISC-V IoT processors","applicationNo":"202631036811","publicationNo":"IN202631036811 A1","glance":"A 4-bit origin tag on every RISC-V register, checked in hardware before the value can steer a branch or a store.","problem":"Many attacks on IoT devices do not hijack control flow at all. They corrupt data: an untrusted input ends up as a store address, a branch target or a key, or a spoofed sensor value is used as if it had been validated. Control-flow integrity, memory tagging and pointer authentication do not track where a value came from, and software data-flow integrity costs too much on a small core.","why":"The thesis showed that defences for small RISC-V cores must be cheap enough to leave on all the time. Existing hardware protects only control flow or memory safety, so there was no always-on mechanism that tracks the provenance of data at the register level and enforces how data of a given origin may be used.","approach":"Every architectural register gets a small companion tag that records where its value came from, for example sensor-raw, sensor-validated, constant, computed, pointer, crypto-key, control or tainted (16 classes in 4 bits). When an instruction retires, a propagation unit computes the destination tag from the source tags using a programmable rules table. Loads take their tag from an address-region map, so data read from a sensor or an untrusted buffer is tagged automatically. A policy unit checks the tag whenever a register is used in a sensitive place (branch target, store address, CSR write, crypto operand) and raises a violation if that origin is not allowed there. The monitor runs beside the pipeline, so instructions that do not violate a policy pay no extra latency.","claims":["A RISC-V processor with a provenance tag file holding a multi-bit tag for each integer register.","A tag propagation unit that sets the destination tag at retirement from the instruction type, the source tags and a programmable propagation rules table (an SRAM indexed by operation class and the two source tags).","An address-tag mapping table of base, mask and tag entries that tags loaded data by its source address.","A policy enforcement unit that checks tags in security-relevant contexts and raises a violation; tag work runs in parallel with execute and decode, so non-violating instructions see no added latency.","Corresponding method and IoT system-on-chip claims."],"results":["230 LUTs (0.43% of the XC7Z020), 428 flip-flops, 0 BRAM, 0 DSP for 32 tags and 4 address regions.","Fmax 139.4 MHz, above the 86 MHz Konark-V core clock, so the monitor never limits the core.","0.106 W total on-chip power, of which 4 mW is dynamic.","0 cycles of added latency on non-violating instructions and 0 cycles from taint to trap; about 29 pJ per instruction (derived).","Validated on a control-data attack pattern: a tainted load used as a store address or branch target is flagged, and a clean register is not (no false positive)."],"measurementPlatform":"Implemented in Chisel on Konark-V, the authors' own dual-hart RV32IM microcontroller (153/153 core tests pass), and placed and routed with Vivado 2020.1 on a Xilinx Zynq XC7Z020 (Zedboard). Numbers are Vivado post-route output; the patent specification describes a larger instance than the one measured.","abstract":"A hardware data-flow integrity monitor (DFIM) for RISC-V processors that provides register-file-level provenance tagging and policy enforcement. The DFIM comprises a Provenance Tag File (PTF) that maintains a 4-bit provenance tag for each architectural register, encoding classifications such as sensor-raw, constant, computed, pointer, crypto-key, and tainted. A Tag Propagation Unit (TPU) determines provenance tags for destination registers based on instruction type and source operand tags using a programmable Propagation Rules Table (PRT) and an Address-Tag Mapping Table (ATMT) that automatically assigns tags based on memory source addresses. A Policy Enforcement Unit (PEU) checks provenance tags against a programmable Policy Table when registers are used in security-relevant contexts including branch targets, store addresses, CSR writes, and cryptographic operations. The DFIM operates in parallel with normal pipeline execution, incurring zero additional latency for non-violating instructions, and requires less than 0.01 mm^2 silicon area. The invention enables detection and prevention of data-flow attacks, including data-oriented programming and sensor manipulation attacks, without software instrumentation overhead.","keywords":["RISC-V","data-flow integrity","provenance tagging","taint tracking","data-oriented programming","IoT security","hardware security monitor"],"short":"Data-flow integrity monitor"},{"inventors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"applicant":"BITS Pilani","office":"Indian Patent Office","status":"Published patent application (not yet granted)","kind":"Indian patent application, Complete Specification (Form 2, Section 10, Patents Act 1970)","id":"hpc-malware-classifier","title":"Hardware-accelerated microarchitectural event classifier with programmable feature extraction pipeline and on-chip ensemble inference engine for real-time malware detection in RISC-V processors","applicationNo":"202631036812","publicationNo":"IN202631036812 A1","glance":"A random-forest malware detector in the RISC-V chip that reads performance counters directly, with no software agent.","problem":"Hardware performance counters can tell malware from benign code, but every deployed detector reads them from software. That costs 2% to 15% of CPU time, samples only every 1 to 10 ms (so short attacks fall between samples), and runs as software that malware can disable or evade by timing camouflage instructions to the sampling points.","why":"My doctoral work on hardware-assisted malware detection found that the weak point of counter-based detection is the software pipeline, not the idea. Moving capture, feature extraction and classification into hardware removes the overhead, the sampling gaps and the software attack surface at once.","approach":"A capture unit taps the performance counters through a private port, so it does not use the normal CSR read path, and produces an event-count vector per time window. A five-stage fixed-point pipeline computes mean, variance, skewness, kurtosis and entropy for each event. A random forest of decision trees, stored in programmable on-chip SRAM, is walked in parallel by one traversal unit per tree, and a majority vote gives the verdict. A resilience monitor uses CUSUM change detection and an instruction-to-event consistency check to spot malware that tries to disguise its counter profile. A Linux kernel module loads trained models and acts on verdicts; retraining only reloads the tree tables.","claims":["A classifier with a direct event-tap capture unit (shadow accumulators and per-window difference calculator) independent of the CSR read port.","A pipelined fixed-point feature engine computing mean, variance, skewness, kurtosis and entropy.","An SRAM-based tree memory with parallel tree traversal units and a majority-vote aggregator, loaded through a CSR interface (for example 64 trees of depth up to 7 traversed in 7 cycles).","An adversarial resilience monitor and a per-process context tracker that tags each event vector with a process identifier.","Method claims and a RISC-V SoC claim with a Linux kernel security module."],"results":["Measured instance: 4 trees x 16 nodes, depth 3, 8 features. 1,542 LUTs (2.9%), 1,869 flip-flops, 0 BRAM, 0 DSP.","Fmax 55.7 MHz; one classification per cycle, i.e. 17.9 ns per verdict and 55.7 million verdicts per second (derived).","0.116 W total, 13 mW dynamic; about 233 pJ per classification (derived).","Validated on five counter snapshots: multi-level traversal, per-tree votes and majority voting behave as programmed, with no false positive on the low-counter snapshot."],"measurementPlatform":"Implemented in Chisel on Konark-V, the authors' own dual-hart RV32IM microcontroller (153/153 core tests pass), and placed and routed with Vivado 2020.1 on a Xilinx Zynq XC7Z020 (Zedboard). Numbers are Vivado post-route output; the patent specification describes a larger instance than the one measured.","abstract":"A hardware-accelerated malware detection system (100) for RISC-V processors comprising a Continuous Event Capture Unit (200) that monitors Hardware Performance Counter values through a direct hardware tap interface at cycle-level granularity, a Pipelined Feature Extraction Engine (300) implementing a five-stage hardware pipeline computing mean, variance, skewness, kurtosis, and Shannon entropy from event count windows using fixed-point arithmetic, an On-Chip Ensemble Inference Engine (400) implementing a Random Forest classifier with 64 parallel decision trees stored in programmable SRAM and traversed simultaneously by dedicated Tree Traversal Units (420) with majority vote aggregation (430), and an Adversarial Resilience Monitor (500) using CUSUM change-point detection (510) and instruction-event correlation analysis (520) to detect attempts to manipulate HPC profiles. The system achieves zero CPU overhead, microsecond-level detection latency, and continuous monitoring without software sampling gaps. A Linux Kernel Security Module (600) loads trained models, configures detection parameters, handles detection interrupts, and enforces configurable response policies. The invention provides tamper-resistant malware detection suitable for resource-constrained IoT deployments on RISC-V processors. (Figure 1)","keywords":["RISC-V","malware detection","hardware performance counters","random forest","on-chip machine learning","adversarial evasion","IoT security"],"short":"On-chip malware classifier"},{"inventors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"applicant":"BITS Pilani","office":"Indian Patent Office","status":"Published patent application (not yet granted)","kind":"Indian patent application, Complete Specification (Form 2, Section 10, Patents Act 1970)","id":"peripheral-crypto-engine","title":"Per-peripheral cryptographic session engine with hardware key rotation for RISC-V IoT system-on-chip","applicationNo":"202631036813","publicationNo":"IN202631036813 A1","glance":"Encrypts on-chip bus traffic to each peripheral with its own key, and rotates keys in hardware without the CPU.","problem":"Inside a system-on-chip, data between the processor and peripherals (ADCs, sensors, crypto accelerators, secure storage) travels in plaintext. Bus probing, fault injection, an open JTAG or debug port, or a hardware Trojan can read it directly. TrustZone, PMP and SiFive Shield isolate software but do not encrypt the internal bus, and none give each peripheral its own key.","why":"The thesis studies how hardware leaks secrets on small RISC-V systems, including memory encryption. The internal bus was the remaining plaintext path. A lightweight, single-cycle cipher makes it possible to encrypt that path at bus speed, and doing key rotation in hardware removes it as something software can forget or be tricked into skipping.","approach":"A key-slot register file holds a separate 128-bit session key and transaction counter for each peripheral channel; firmware loads the keys at secure boot and software cannot read them back. Each bus transaction is encrypted with PRINCE, a low-latency 64-bit block cipher, using the channel key with the transaction counter as a tweak, so the same data never produces the same ciphertext twice. A key-rotation state machine watches each counter and, at a configured threshold, derives a new key by enciphering the old one and swaps it in atomically. Small decrypt and encrypt stubs next to each peripheral complete the channel. Compromise of one channel's key does not expose the others.","claims":["A RISC-V SoC with a per-peripheral cryptographic session engine on the internal bus and a key-slot register file of per-channel keys, counters and configuration bits.","A lightweight block cipher (PRINCE) performing single-cycle encryption and decryption with the transaction counter as a tweak.","An autonomous key-rotation finite state machine that derives and commits new keys when a channel's counter crosses its threshold, without processor involvement.","Peripheral-side cryptographic stubs and bus interception logic that select the key by target peripheral.","Method claims and a secure IoT SoC claim."],"results":["PRINCE-64 core is bit-exact against all 5 published test vectors, in both a Scala reference model and the synthesised hardware.","Full 4-channel engine: 3,642 LUTs (6.85%), 752 flip-flops, 0 BRAM, 0 DSP; one unrolled cipher alone is 1,192 LUTs.","Fmax 38.7 MHz with a single-cycle, fully unrolled 12-round cipher (26.5 ns combinational path); 0.503 W total, 0.394 W dynamic.","Derived bus-encryption throughput 2.48 Gbit/s at about 159 pJ/bit (10.2 nJ per 64-bit block).","Waveform shows the key changing on its own as transactions accumulate and the rotation flag setting at the threshold."],"measurementPlatform":"Implemented in Chisel on Konark-V, the authors' own dual-hart RV32IM microcontroller (153/153 core tests pass), and placed and routed with Vivado 2020.1 on a Xilinx Zynq XC7Z020 (Zedboard). Numbers are Vivado post-route output; the patent specification describes a larger instance than the one measured.","abstract":"A per-peripheral cryptographic session engine (PCSE) for RISC-V IoT System-on-Chip architectures provides cryptographic protection for internal bus communication between the processor core and peripheral interfaces. The PCSE maintains individual session keys for each peripheral channel in a key-slot register file, enabling cryptographic isolation where compromise of one channel does not expose data from other channels. A lightweight PRINCE block cipher engine performs single-cycle encryption and decryption of bus transactions using per-channel keys and transaction counter tweaks. An autonomous key rotation finite state machine monitors transaction counts and derives new keys when configurable thresholds are reached, without processor involvement. Peripheral-side cryptographic stubs complete the encrypted communication channel. The invention addresses security gaps in existing architectures where internal bus traffic travels in plaintext, protecting against side-channel probing, fault injection, and debug port exploitation. The compact implementation requires less than 0.03 square millimeters and less than 200 microwatts, suitable for resource-constrained IoT applications including medical devices, smart meters, and automotive systems.","keywords":["RISC-V","SoC bus encryption","PRINCE cipher","key rotation","per-peripheral isolation","IoT security","hardware cryptography"],"short":"Per-peripheral crypto engine"},{"inventors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"applicant":"BITS Pilani","office":"Indian Patent Office","status":"Published patent application (not yet granted)","kind":"Indian patent application, Complete Specification (Form 2, Section 10, Patents Act 1970)","id":"trace-bdt-detector","title":"On-chip binary decision tree inference engine integrated with RISC-V trace encoder for real-time IoT security monitoring","applicationNo":"202631036814","publicationNo":"IN202631036814 A1","glance":"Turns the RISC-V trace encoder from a passive recorder into an on-chip detector for ROP and control-flow hijacking.","problem":"RISC-V trace encoders (N-Trace, E-Trace) already see every branch, return and exception, but they only record and export it for offline analysis. Attacks such as return-oriented programming, code injection and control-flow hijacking finish long before external analysis can respond. ARM PAC and Intel CET do not exist on RISC-V, and software CFI is too heavy for IoT cores.","why":"The execution evidence needed to catch these attacks is already on the chip, in the trace path. The gap was that nothing analysed it in place. A small decision tree is cheap enough to evaluate in hardware every cycle, which gives detection without new instrumentation.","approach":"A feature extractor reads trace packets and keeps running counts over a sliding window of recent instructions: branch frequency, return-address consistency, instruction mix, indirect-jump target spread and interrupt rate, each quantised to 4 bits. A pre-trained binary decision tree in a small on-chip SRAM is walked node by node over these features and gives a classification within eight clock cycles. An alert controller with a confidence accumulator (several anomalous verdicts in a row before a severe response) can log, raise a non-maskable interrupt, halt into debug, or inject an alert into the trace stream. Only machine mode can update the model.","claims":["A RISC-V processor with an anomaly detection engine coupled to the trace encoder output, including a trace feature extractor.","A binary decision tree inference unit with node words (leaf flag, feature selector, threshold, child pointers, class) in on-chip SRAM, giving a classification in a bounded number of cycles.","An alert and response controller with a confidence accumulator and configurable responses (log, NMI, debug halt, trace injection).","Machine-mode-only CSR interface for secure model updates.","Method claims and an IoT SoC claim."],"results":["Measured instance: 16-commit sliding window and 16-node tree. 307 LUTs (0.58%), 405 flip-flops, 0 BRAM, 0 DSP.","Fmax 70.6 MHz; inspects every committed instruction. 0.110 W total, 7 mW dynamic.","ROP burst detected after 13 commits (about 184 ns) with 0 false positives in the test traces.","The anomaly clears once benign instructions push the burst out of the window, which shows the O(1) sliding-window subtract works."],"measurementPlatform":"Implemented in Chisel on Konark-V, the authors' own dual-hart RV32IM microcontroller (153/153 core tests pass), and placed and routed with Vivado 2020.1 on a Xilinx Zynq XC7Z020 (Zedboard). Numbers are Vivado post-route output; the patent specification describes a larger instance than the one measured. The measured version extracts features from the commit stream rather than from encoded trace packets.","abstract":"An Anomaly Detection Engine (ADE) integrated with a RISC-V trace encoder for real-time security monitoring in Internet-of-Things devices. The ADE comprises a Trace Feature Extractor that derives behavioral metrics including branch frequency, return address consistency, instruction mix distribution, jump target dispersion, and interrupt frequency from execution trace packets. A Binary Decision Tree Inference Unit stores a pre-trained decision tree in on-chip SRAM and traverses the tree using extracted features to produce security classifications within eight clock cycles. An Alert and Response Controller generates configurable responses including logging, non-maskable interrupts, debug halt, or trace stream injection based on classification results and a confidence accumulator that prevents false-positive alerts. Machine-mode control registers enable secure model updates for adapting to evolving threats. The invention achieves sub-microsecond detection latency with less than 0.015 mm^2 area overhead and 20-100 uW power consumption at 100 MHz, enabling practical deployment in resource-constrained IoT devices.","keywords":["RISC-V","trace encoder","decision tree","return-oriented programming","control-flow hijacking","anomaly detection","IoT security"],"short":"Trace-encoder decision tree"},{"inventors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"applicant":"BITS Pilani","office":"Indian Patent Office","status":"Published patent application (not yet granted)","kind":"Indian patent application, Complete Specification (Form 2, Section 10, Patents Act 1970)","id":"tiered-memory-thunderbolt","title":"RISC-V processor architecture with tiered-memory ISA extension, tier-aware translation lookaside buffer, and Thunderbolt-attached external DRAM expansion with RISC-V bridge controller for Linux-based heterogeneous memory systems","applicationNo":"202631036815","publicationNo":"IN202631036815 A1","glance":"ISA instructions and hardware page migration that let a RISC-V machine use Thunderbolt-attached DRAM as a memory tier.","problem":"Workloads such as LLM inference, virtual machines and EDA often need more memory than a consumer machine has. CXL memory expansion exists only on server processors. Linux can tier memory, but page migration is done in software (unmap, copy 4 KB through the CPU, update page tables, flush TLBs), which is too slow for a high-latency external tier. No ISA has instructions that know about memory tiers.","why":"RISC-V's custom opcode space, reserved page-table bits and custom CSRs make it possible to put tier awareness into the ISA itself. Thunderbolt 5 offers 80 Gbps on consumer hardware but had not been used for DRAM expansion with NUMA integration.","approach":"Layer 1 is an ISA extension, Xmtier, with tier-aware loads and stores (LD.TIER, SD.TIER), a page-migration instruction (MIGRATE), a tier statistics instruction (TIERSTAT) and a load-wait instruction (LWAIT). The TLB gains a 2-bit tier field per entry so the load/store unit can adapt to slow memory, an asynchronous load queue lets slow-tier loads proceed without stalling the core, and a hardware engine moves pages between tiers and shoots down TLB entries when done. Layer 2 is an external Thunderbolt enclosure built around a RISC-V bridge controller with custom DDR5 instructions, a latency-hiding cache with firmware prefetch and a write-snoop invalidation protocol for coherence without CXL. Layer 3 is a Linux kernel module that registers the external DRAM as a NUMA node and handles hot-plug.","claims":["A RISC-V processor with the Xmtier tiered-memory ISA extension and a tier-aware TLB holding a tier field per entry.","An asynchronous load queue for non-blocking access to high-latency tiers and a hardware page migration engine with automatic TLB shootdown.","A RISC-V SoC bridge controller for connecting external DRAM over Thunderbolt or USB4, with custom DDR5 command instructions and a latency-compensating cache.","A Linux kernel integration module for ACPI SRAT/HMAT injection, NUMA node registration, hardware-accelerated migration and hot-plug.","The Xmtier encoding itself, in the RISC-V custom-1 opcode space."],"results":["Measured scope is the on-chip control core only (tier table, heat-based migration, coldest-page eviction, pin instruction, async load queue), not the Thunderbolt device or kernel layers.","8 pages, fast-tier capacity 2, 4-slot queue: 144 LUTs (0.27%), 71 flip-flops, 0 BRAM, 0 DSP; Fmax 86.4 MHz; 0.105 W total, 2 mW dynamic.","Average access latency 2.40x lower than without tiering (6.00 to 2.50 cycles, 70% fast-tier hits) over an 80-access simulated trace.","Validated hot-page promotion, correct coldest-page eviction and out-of-order completion of a fast load ahead of an outstanding slow load."],"measurementPlatform":"Implemented in Chisel on Konark-V, the authors' own dual-hart RV32IM microcontroller (153/153 core tests pass), and placed and routed with Vivado 2020.1 on a Xilinx Zynq XC7Z020 (Zedboard). Numbers are Vivado post-route output; the patent specification describes a larger instance than the one measured.","abstract":"A three-layer architecture for heterogeneous memory systems comprising: (1) a RISC-V ISA extension (Xmtier) defining tier-aware load/store instructions (LD.TIER, SD.TIER), a hardware page migration instruction (MIGRATE), a tier statistics instruction (TIERSTAT), and a load-wait instruction (LWAIT), with a tier-aware TLB (700) extending page table entries with a tier field, an asynchronous load queue (800) for non-blocking high-latency memory access, and a hardware page migration engine (900) that substantially accelerates page migration compared to software; (2) a Thunderbolt-attached external DRAM expansion device built around a RISC-V bridge controller SoC (200) with custom DDR5 instructions (DDRSEQ, DDRREFRESH, DDRTRAIN), a latency-compensating cache (300) with a write-snoop invalidation protocol (WSIP) for cache coherence and firmware-driven prefetch, and DDR5 memory module interfaces; and (3) a Linux kernel module (400) leveraging the Xmtier extension for dynamic ACPI SRAT/HMAT injection, NUMA node registration, hardware-accelerated page migration, and hot-plug lifecycle management. Multi-port Thunderbolt bandwidth aggregation (500) increases aggregate bandwidth by address-interleaved striping across multiple ports. The invention enables RISC-V processors to transparently utilise Thunderbolt-attached DRAM for memory-intensive workloads with ISA-level support for heterogeneous memory tiering. (Figure 1)","keywords":["RISC-V","ISA extension","memory tiering","NUMA","TLB","page migration","Thunderbolt","DRAM expansion","Linux kernel"],"short":"Tiered memory over Thunderbolt"},{"inventors":["Jyotiprakash Mishra","Sanjay K. Sahay","Swati Mishra","Aman Pathak"],"applicant":"BITS Pilani","office":"Indian Patent Office","status":"Published patent application (not yet granted)","kind":"Indian patent application, Complete Specification (Form 2, Section 10, Patents Act 1970)","id":"instruction-fusion-engine","title":"Programmable instruction fusion engine with SRAM-based rules table for RISC-V IoT processors","applicationNo":"202631036816","publicationNo":"IN202631036816 A1","glance":"Macro-op fusion whose rules live in a small SRAM table, so a shipped chip can be retuned for each workload.","problem":"Macro-op fusion (for example LUI+ADDI into one 32-bit constant load) saves pipeline slots and energy, but in Intel, ARM, BOOM and commercial RISC-V cores the fusible pairs are hardwired. An IoT chip runs very different code (sensor filtering, cryptography, control loops, radio protocols) over a 5 to 10 year life, and a fixed rule set helps one workload and not the others.","why":"I wanted the benefit of fusion on small RISC-V cores without fixing the choice of patterns at tape-out. Storing rules in SRAM, written through CSRs, makes fusion a software decision, and banking the table lets each task bring its own rules.","approach":"A fusion detection unit sits between the fetch buffer and the decoder. Each rule entry in an SRAM table describes a pair of instructions (opcode and function-field masks), the register dependency required between them, and the fused micro-op to emit. Match logic compares the current pair against all rules in one cycle, a priority encoder picks one if several match, and a generator emits a single internal operation. A dependency check makes sure the second instruction really consumes the first one's result, so fusion never changes program meaning. The table is banked, and one CSR write switches banks at a context switch. A fusion counter supports profiling, and a constant-time mode can disable fusion for security-sensitive code.","claims":["A RISC-V processor with a fusion detection unit containing an SRAM-based rules table, parallel match logic and a fused micro-op generator.","A 48-bit rule entry format: opcode and function-field masks for both instructions, register dependency flags, fused micro-op type, latency hint, priority and enable bit.","A banked rules table switched in a single cycle by a CSR write, giving zero-overhead rule-set changes at context switches.","A register-dependency verification sub-unit and a fusion statistics counter readable through a CSR.","Method claims and an IoT SoC claim with firmware that programs the rules."],"results":["64-entry rules table: 155 LUTs (0.29%), 406 flip-flops, 0 BRAM, 0 DSP; Fmax 196.6 MHz; 0.107 W total, 4 mW dynamic.","1.25x effective IPC on a 400-instruction array load-accumulate loop: 80 of 400 instructions fused (20%), 400 issue slots reduced to 320.","About 20 pJ per fusion decision (derived from dynamic power and Fmax).","Validated LUI+ADDI, AUIPC+ADDI and ADD+LD fusions in-stream; a programmed pair without the required data dependency is correctly not fused."],"measurementPlatform":"Implemented in Chisel on Konark-V, the authors' own dual-hart RV32IM microcontroller (153/153 core tests pass), and placed and routed with Vivado 2020.1 on a Xilinx Zynq XC7Z020 (Zedboard). Numbers are Vivado post-route output; the patent specification describes a larger instance than the one measured.","abstract":"A programmable instruction fusion mechanism for RISC-V processors comprising a Fusion Detection Unit (120) positioned between a fetch buffer (115) and a decode unit (130). The Fusion Detection Unit includes an SRAM-based rules table (122) storing fusion rule entries that specify instruction patterns and register dependency requirements for fusible instruction pairs. A parallel match logic array (124) compares consecutive instruction pairs against all rule entries simultaneously in a single clock cycle. When a match is detected, a fused micro-operation generator (126) emits a single internal operation encoding both original instructions, reducing pipeline bandwidth and energy consumption. The SRAM-based storage enables runtime modification of fusion rules through a Control-and-Status Register interface without hardware changes. A banked rules table architecture supports zero-overhead switching between workload-specific fusion rule sets during context switches, making the invention particularly suitable for Internet-of-Things processors that execute diverse workloads including sensor processing, cryptography, and communication protocols. (Figure 1)","keywords":["RISC-V","macro-op fusion","instruction fusion","programmable decode","microarchitecture","IoT processors","energy efficiency"],"short":"Instruction fusion engine"}],"books":[{"id":"cryptographic-foundations","title":"Cryptographic Foundations","subtitle":"Symmetric and Public-Key Cryptography, Hashes, Digital Signatures, and Protocols","authors":["Jyotiprakash Mishra","Sanjay K. Sahay"],"publisher":"De Gruyter Brill, Berlin","series":"De Gruyter Textbook","isbn":"978-3-11-226702-8","isbnPaperback":"978-3-11-226702-8","isbnEbook":"978-3-11-226703-5","status":"Approved; in proofreading (listed by the publisher as 'Ahead of Publication')","expected":"Jan/Feb 2027 per the author's CV; the publisher page lists a planned publication date of December 28, 2026 for paperback and eBook","url":"https://www.degruyterbrill.com/document/isbn/9783112267028/html","pages":"10 front-matter pages + 471 main pages (publisher); 188 illustrations, 27 tables","audience":"Undergraduates, Postgraduates (publisher listing)","publisherKeywords":["Applied Cryptography","Post-Quantum Cryptography","Elliptic-Curve Cryptography","Python Cryptography","Security Proofs and Reductions"],"glance":"A graduate textbook on modern cryptography that proves each primitive, then has the reader implement it in Python.","why":"The book grew out of cryptography courses taught at BITS Pilani K. K. Birla Goa Campus and the research collaboration between the two authors. The authors wanted readers to understand the libraries they call, not treat them as a black box of 'use AES-GCM and do not think about it'. Existing books tend to be either theory-first (Katz and Lindell, Boneh and Shoup) or engineering-first (Schneier, Aumasson); this one aims to sit between them.","audienceDetail":"Advanced undergraduate and beginning graduate students in computer science, mathematics or engineering who meet cryptography for the first time, and working engineers who want the foundations of the libraries they use. It assumes basic programming (ideally Python) and a first course in discrete mathematics or linear algebra; modular arithmetic, finite fields, probability, security games, reductions and elliptic curves are developed from first principles.","different":["Every scheme gets a precise security definition and, where appropriate, a proof or reduction, and also code: theory, practice and implementation in each chapter.","Post-quantum standards (ML-KEM, ML-DSA, SLH-DSA, and hybrid X25519 + ML-KEM-768) are taught inside the public-key chapters, not in a separate add-on chapter.","667 graded exercises (about fifty per chapter, rated one to three stars) in four kinds: practice, exercises, problems and programming tasks checked against published test vectors.","Appendix B is a runnable Python and SageMath cookbook that the programming exercises build on.","States openly which results are proved and which rest on heuristics such as the random oracle model; historical attributions, standard numbers and quoted results were audited against primary sources."],"description":"Publisher text: a graduate-level textbook that introduces students and working engineers to the mathematics and practice of modern cryptography, from classical ciphers and security definitions through symmetric primitives (block ciphers, modes, hash functions, MACs) to public-key cryptography (RSA, elliptic curves, digital signatures, key exchange, PKI), with post-quantum cryptography (ML-KEM, ML-DSA, SLH-DSA) integrated throughout the public-key chapters rather than confined to a separate section.","toc":[{"part":"Part I: Foundations","chapters":[{"n":1,"title":"Introduction to Cryptography","summary":"Why cryptography matters, a short history of secret writing, symmetric versus asymmetric schemes, and how to think about security."},{"n":2,"title":"Mathematical Foundations","summary":"Modular arithmetic, GCDs, groups, Euler and Fermat, the CRT, finite fields, primality and factoring, and probability."},{"n":3,"title":"Defining Security","summary":"Security games, semantic security and indistinguishability, unforgeability, reduction proofs and pseudorandomness."}]},{"part":"Part II: Symmetric Cryptography","chapters":[{"n":4,"title":"Encryption and the Quest for Secrecy","summary":"Perfect secrecy, stream ciphers from classical designs to ChaCha20, and their semantic security."},{"n":5,"title":"Block Ciphers","summary":"SP networks and Feistel networks, DES as a case study, AES, and an overview of attacks."},{"n":6,"title":"Modes of Operation and Authenticated Encryption","summary":"Classical modes and CTR, why encryption alone is not enough, AES-GCM, ChaCha20-Poly1305 and nonce-misuse resistance."},{"n":7,"title":"Cryptographic Hash Functions","summary":"The birthday attack, Merkle-Damgard, the SHA family, SHA-3 and the sponge, and applications of hashing."},{"n":8,"title":"Message Authentication Codes","summary":"HMAC, block-cipher MACs, universal hashing and polynomial MACs, and combining encryption with authentication."}]},{"part":"Part III: Public-Key Cryptography","chapters":[{"n":9,"title":"Public-Key Encryption","summary":"The key distribution problem, RSA and attacks on textbook RSA, OAEP, ElGamal, hybrid encryption, and ML-KEM."},{"n":10,"title":"Elliptic Curve Cryptography","summary":"Curves over the reals and finite fields, the ECDLP, scalar multiplication, standard and modern curves, and key sizes."},{"n":11,"title":"Digital Signatures","summary":"RSA, Schnorr, DSA and ECDSA, EdDSA and Ed25519, compared, with the post-quantum ML-DSA and SLH-DSA."},{"n":12,"title":"Key Exchange","summary":"Diffie-Hellman and ECDH, the man-in-the-middle problem, KEMs versus key agreement, forward secrecy, and hybrid X25519 + ML-KEM."},{"n":13,"title":"Certificates and Public-Key Infrastructure","summary":"Digital certificates, PKI, Certificate Transparency, alternative trust models, and Let's Encrypt with automated certificate management."}]},{"part":"Appendices","chapters":[{"n":"A","title":"Proof Techniques in Cryptography","summary":"From direct proof and induction to reductions, simulation, hybrid arguments, game hopping and the random oracle method."},{"n":"B","title":"Python and SageMath Setup Guide","summary":"Environment setup, core libraries and a programming cookbook for every primitive in the book."}]}],"short":"Cryptographic Foundations"},{"id":"riscv-xv6","title":"RISC-V Architecture and XV6","subtitle":"Instruction Set Architecture, Systems Programming, and Kernel Development","authors":["Jyotiprakash Mishra","Sanjay K. Sahay"],"publisher":"De Gruyter Brill, Berlin","isbn":"978-3-11-227456-9","status":"Approved; in proofreading (final manuscript submitted)","expected":"Jan/Feb 2027 (per the author's CV)","pages":"649 pages in the submitted manuscript PDF (final-submission); publisher page count not found","glance":"A bottom-up textbook from the first RV64 instruction to reading and modifying the xv6 operating system kernel.","why":"The book grew out of a gap students run into: architecture texts teach how instructions are encoded and executed but say little about privilege levels, while operating-systems texts, including the well-known xv6 commentary, show kernel code but assume the reader already knows what a CSR is, why MRET restores the program counter, or how a page-table walk interacts with Physical Memory Protection. Without that, kernel code reads like magic spells. This book teaches the hardware first so the kernel makes sense.","audienceDetail":"Readers who can program in C and have had an introductory CS course. Three groups: undergraduate or early-graduate students in computer architecture, operating systems, or a combined course; working engineers moving to RISC-V who need the privileged specification explained rather than cited; and self-learners who have read the xv6 source and want to see what lies underneath it. No prior assembly or operating-systems course is required.","different":["Teaches the machine before the software that controls it: the re
